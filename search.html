<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerca — Web 7.0</title>
<link rel="stylesheet" href="web7.css">
<style>
.wrap { max-width: 720px; margin: auto; }
.result { display: block; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.result h3 { font-size: 16px; color: var(--accent); overflow-wrap: anywhere; }
.result p { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<header class="top">
  <a class="round" href="index.html" aria-label="Torna a Web 7.0">‹</a>
  <a class="brand" href="search.html">◈ <b>Cerca</b></a>
</header>
<main class="content" style="padding-bottom:30px"><div class="wrap">
  <form class="search" style="margin-bottom:12px" onsubmit="event.preventDefault();runSearch()"><input id="q" type="search" placeholder="Cerca su Freenet" aria-label="Cerca" autocomplete="off"></form>
  <div class="chips" id="tabs"></div>
  <div id="notice"></div>
  <div id="results"></div>
  <details class="panel" style="margin-top:20px"><summary style="cursor:pointer;font-weight:700">Aggiungi un sito Freenet all'indice</summary>
    <form style="margin-top:12px" onsubmit="event.preventDefault();addSite(this)">
      <label class="field"><span>Chiave del sito</span><input name="key" required autocomplete="off"></label>
      <label class="field"><span>Nome</span><input name="title" maxlength="120" required></label>
      <label class="field"><span>Descrizione</span><textarea name="desc" maxlength="500"></textarea></label>
      <button class="btn main">Aggiungi</button></form></details>
</div></main>
<script src="fn-ws.js"></script>
<script src="fn-net.js"></script>
<script src="social.js"></script>
<script>
const { esc, timeAgo } = FNet;
const SITES = 'dir:sites';
const TABS = [['all', 'Tutto'], ['app', 'App'], ['site', 'Siti'], ['video', 'Video'], ['photo', 'Foto'], ['post', 'Post'], ['wiki', 'Wiki'], ['forum', 'Forum'], ['channel', 'Canali']];
const FORUMS = ['scienza', 'matematica', 'programmazione', 'storia', 'lingue', 'tecnologia', 'freenet'];
let loading = 0;
const APPS = [
  ['FreenetTV', 'Video educativi peer to peer', 'video.html'], ['FreenetGram', 'Foto e storie', 'photos.html'],
  ['FreenetPosts', 'Post brevi senza algoritmi', 'posts.html'], ['FreenetWiki', 'Enciclopedia libera scritta da tutti', 'wiki.html'],
  ['FreenetForum', 'Comunità con discussioni e voti', 'forum.html'], ['Scacchi', 'Contro il computer o persone della rete', 'chess.html'],
  ['River', 'Chat di gruppo', 'index.html#open=river'], ['Freenet Mail', 'Posta peer to peer', 'index.html#open=mail'],
  ['Ghostkey', 'Identità crittografica', 'index.html#open=ghostkey'], ['Atlas', 'Scoperta di contenuti', 'index.html#open=atlas'],
  ['Delta', 'Costruttore di siti', 'index.html#open=delta'], ['freenet.org', 'Sito ufficiale sulla rete', 'index.html#open=freenetorg'],
];
let tab = 'all';
let index = [];
let online = true;

// Ogni bacheca entra nei risultati appena arriva: non si aspetta la più lenta.
async function buildIndex() {
  const parts = new Map();
  const apps = APPS.map(([title, text, href]) => ({ type: 'app', title, text, href }));
  const names = new Map();
  const merge = () => { index = apps.concat(...parts.values()); draw(); };
  const add = (feed, make) => {
    loading++;
    return FNet.readItems(feed).then(list => {
      if (list.online === false) online = false;
      list.filter(FNet.isVisible).forEach(i => i.tag && i.name && names.set(i.tag, i.name));
      parts.set(feed, list.filter(FNet.isVisible).map(make).filter(Boolean));
    }).catch(() => { online = false; }).finally(() => { loading--; merge(); });
  };
  online = true;
  merge();
  await Promise.all([
    add(SITES, s => FNet.SAFE_KEY.test(s.key || '') && { type: 'site', title: s.title, text: s.desc, href: 'index.html#open=' + s.key, time: s.created }),
    add('feed:video', v => ({ type: 'video', id: v.id, title: v.title, text: `${v.name} · ${v.cat || ''} · ${v.desc || ''}`, href: 'video.html#/watch/' + v.id, time: v.created })),
    add('feed:photo', p => ({ type: 'photo', id: p.id, title: p.caption || 'Foto di ' + p.name, text: p.name, href: 'photos.html#/p/' + p.id, time: p.created })),
    add('feed:post', n => n.text && { type: 'post', id: n.id, title: n.name, text: n.text, href: 'posts.html#/p/' + n.id, time: n.created }),
    add('wiki:index', a => a.title && { type: 'wiki', title: a.title, text: a.summary, href: 'wiki.html#/w/' + a.slug, time: a.created }),
    ...FORUMS.map(f => add('forum:r:' + f, t => t.title && { type: 'forum', id: t.id, title: t.title, text: `f/${f} · ${t.name} · ${t.text || ''}`, href: `forum.html#/t/${f}/${t.id}`, time: t.created })),
    add('feed:channels', c => ({ type: 'channel', title: names.get(c.tag) || c.name, text: c.bio, href: 'video.html#/channel/' + c.tag, time: c.created })),
  ]);
}
function score(entry, words, phrase) {
  const title = String(entry.title || '').toLowerCase(), text = String(entry.text || '').toLowerCase();
  if (entry.id === phrase) return 100;
  let s = 0;
  for (const w of words) {
    if (title.includes(w)) s += title.startsWith(w) ? 4 : 3;
    else if (text.includes(w)) s += 1;
    else return 0;
  }
  return s + (title.includes(phrase) ? 3 : 0);
}
const LABEL = { app: 'App', site: 'Sito', video: 'Video', photo: 'Foto', post: 'Post', wiki: 'Wiki', forum: 'Forum', channel: 'Canale' };
function draw() {
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button class="chip ${k === tab ? 'on' : ''}" onclick="tab='${k}';draw()">${l}</button>`).join('');
  document.getElementById('notice').innerHTML = Social.offlineNotice(online) + (loading ? `<p class="sub" style="margin-bottom:8px">🔄 Cerco nella rete Freenet… (${loading} ${loading === 1 ? 'fonte' : 'fonti'} ancora in arrivo)</p>` : '');
  const phrase = document.getElementById('q').value.trim();
  const low = phrase.toLowerCase();
  const words = low.split(/\s+/).filter(Boolean);
  const pool = index.filter(e => tab === 'all' || e.type === tab);
  const found = words.length
    ? pool.map(e => ({ e, s: e.id === phrase ? 100 : score(e, words, low) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s || (b.e.time || 0) - (a.e.time || 0)).map(x => x.e)
    : pool;
  const keyBox = FNet.SAFE_KEY.test(phrase) ? `<div class="panel" id="keycheck"><b>Link Freenet</b><div class="sub" style="overflow-wrap:anywhere">${esc(phrase)}</div><p id="keystate" style="margin-top:6px">Controllo sulla rete se è pubblico…</p></div>` : '';
  if (keyBox) checkKey(phrase);
  document.getElementById('results').innerHTML = keyBox + (found.length
    ? found.slice(0, 100).map(e => `<a class="result" href="${esc(e.href)}"><div class="sub">${LABEL[e.type]}${e.time ? ' · ' + esc(timeAgo(e.time)) : ''}</div><h3>${esc(e.title)}</h3><p class="sub">${esc(e.text || '')}</p></a>`).join('')
    : keyBox ? '' : loading ? '' : '<div class="empty"><div>🔎</div><h2>Nessun risultato</h2><p>La ricerca copre ciò che è stato pubblicato su Web 7.0 e i siti aggiunti all\'indice.</p></div>');
}
// Un link è pubblico se il nodo riesce a trovarne il contratto sulla rete Freenet.
let keyCheckSeq = 0;
async function checkKey(key) {
  const seq = ++keyCheckSeq;
  let text;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);
    const r = await fetch(FNet.siteUrl(key, 'index.html'), { signal: ctrl.signal });
    clearTimeout(timer);
    text = r.ok ? 'public' : 'missing';
  } catch { text = 'unreachable'; }
  const el = document.getElementById('keystate');
  if (!el || seq !== keyCheckSeq) return;
  const href = FNet.INSIDE_FREENET ? FNet.siteUrl(key, '') : 'index.html#open=' + key;
  const target = FNet.INSIDE_FREENET ? ' target="_blank" rel="noopener"' : '';
  el.innerHTML = text === 'public'
    ? `✅ Pubblico: il sito è sulla rete Freenet. <a class="btn main" style="margin-left:6px" href="${esc(href)}"${target}>Apri</a>`
    : text === 'missing'
      ? '❌ Non trovato: nessun sito pubblico con questa chiave sulla rete Freenet.'
      : '⚠️ Non riesco a controllare: il nodo non risponde.';
}
async function runSearch() {
  const q = document.getElementById('q').value.trim();
  // Dentro Freenet la pagina non può cambiare il proprio indirizzo: la ricerca va avanti lo stesso.
  try { history.replaceState(null, '', 'search.html?q=' + encodeURIComponent(q)); } catch {}
  draw();
}
async function addSite(form) {
  const key = form.key.value.trim();
  if (!FNet.SAFE_KEY.test(key)) { Social.toast('Chiave non valida'); return; }
  try {
    await FNet.saveItem(SITES, 's' + key.slice(0, 40), { key, title: form.title.value.trim(), desc: form.desc.value.trim(), vis: 'public' });
    Social.toast('Sito aggiunto');
    form.reset();
    await buildIndex();
  } catch (e) { Social.toast(e.message); }
}
document.getElementById('q').value = new URLSearchParams(location.search).get('q') || '';
document.getElementById('q').addEventListener('input', draw);
buildIndex();
</script>
</body>
</html>
