<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Web 7.0 — Avvio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#2ea44f;--g2:#3fb95f;
  --bg:#0d1117;--bg2:#161b22;
  --text:#f0f6fc;--text2:#8b949e;
  --accent:#0a84ff;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
}

/* blob di sfondo */
.bg-blob{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-blob b{position:absolute;border-radius:50%;filter:blur(90px);opacity:.15;animation:drift 9s infinite alternate ease-in-out}
.bg-blob b:nth-child(1){width:clamp(200px,50vw,420px);height:clamp(200px,50vw,420px);background:var(--g);top:-20%;left:-15%;animation-delay:0s}
.bg-blob b:nth-child(2){width:clamp(150px,35vw,300px);height:clamp(150px,35vw,300px);background:#1a7f37;bottom:-15%;right:-10%;animation-delay:-4s}
.bg-blob b:nth-child(3){width:clamp(100px,20vw,200px);height:clamp(100px,20vw,200px);background:var(--accent);top:40%;left:55%;animation-delay:-7s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(25px,15px) scale(1.08)}}

.card{
  position:relative;z-index:1;text-align:center;
  padding:clamp(28px,6vw,56px) clamp(20px,5vw,40px);
  width:min(380px,90vw);
}

/* logo */
.logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:10px}
.logo-icon{
  width:clamp(44px,10vw,60px);height:clamp(44px,10vw,60px);
  background:var(--g);border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(22px,5vw,30px);
  box-shadow:0 0 28px rgba(46,164,79,.5);
  flex-shrink:0;
}
.logo-text{font-size:clamp(22px,6vw,32px);font-weight:700;letter-spacing:-1px;white-space:nowrap}
.logo-text sup{font-size:.5em;color:var(--g);font-weight:600;vertical-align:super}

.datetime{font-size:12px;color:var(--text2);margin-bottom:clamp(20px,4vw,32px);letter-spacing:.03em}

/* spinner */
.spin-wrap{position:relative;width:clamp(80px,20vw,120px);height:clamp(80px,20vw,120px);margin:0 auto clamp(20px,4vw,32px)}
.spin-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.r1{fill:none;stroke:rgba(46,164,79,.13);stroke-width:6}
.r2{fill:none;stroke:var(--g);stroke-width:6;stroke-linecap:round;
  stroke-dasharray:220;stroke-dashoffset:60;animation:sp1 1.4s linear infinite}
.r3{fill:none;stroke:rgba(63,185,80,.4);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:120;stroke-dashoffset:30;animation:sp2 2.1s linear infinite reverse}
@keyframes sp1{to{stroke-dashoffset:280}}
@keyframes sp2{to{stroke-dashoffset:-120}}
.spin-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,5vw,36px)}

/* testo stato */
.status{font-size:14px;color:var(--text2);margin-bottom:8px;min-height:22px;line-height:1.4}
.dot{display:inline-block;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}

/* badge nodo trovato */
.badge{
  display:none;margin:12px 0;padding:10px 18px;border-radius:10px;
  background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);
  color:#3fb950;font-size:13px;font-weight:600;line-height:1.4;
}
.badge.show{display:block;animation:pop .3s ease}
.badge.err{background:rgba(255,100,50,.1);border-color:rgba(255,100,50,.3);color:#ff6432}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}

/* bottone apri */
.btn{
  display:none;margin-top:18px;padding:clamp(12px,3vw,16px) 40px;
  border-radius:12px;background:var(--g);color:#fff;
  font-size:clamp(14px,3.5vw,16px);font-weight:700;
  border:none;cursor:pointer;width:100%;
  transition:background .2s, transform .1s;letter-spacing:.03em;
}
.btn:hover{background:var(--g2)}
.btn:active{transform:scale(.97)}
.btn.show{display:block;animation:pop .3s ease}

.skip{font-size:11px;color:rgba(255,255,255,.18);margin-top:16px;cursor:pointer;user-select:none}
</style>
</head>
<body>
<div class="bg-blob"><b></b><b></b><b></b></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🌐</div>
    <div class="logo-text">Web 7.0<sup>β</sup></div>
  </div>
  <div class="datetime" id="dt"></div>

  <div class="spin-wrap">
    <svg viewBox="0 0 120 120">
      <circle class="r1" cx="60" cy="60" r="50"/>
      <circle class="r2" cx="60" cy="60" r="50"/>
      <circle class="r3" cx="60" cy="60" r="38"/>
    </svg>
    <div class="spin-icon">🌐</div>
  </div>

  <div class="status" id="st">
    Avvio<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
  </div>
  <div id="badge" class="badge"></div>
  <button class="btn" id="btn" onclick="openWeb7()">🚀 Apri Web 7.0</button>
  <p class="skip" onclick="openWeb7()">Apri senza nodo →</p>
</div>

<script>
/* ── Orologio ──────────────────────────────────────────────── */
(function clock(){
  const el=document.getElementById('dt');
  function tick(){
    const n=new Date();
    el.textContent=n.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})
      +' · '+n.toLocaleTimeString('it-IT');
  }
  tick(); setInterval(tick,1000);
})();

/* ── Helpers UI ─────────────────────────────────────────────── */
const st=document.getElementById('st');
const badge=document.getElementById('badge');
const btn=document.getElementById('btn');

function setStatus(msg,dots){
  st.innerHTML=msg+(dots?'<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>':'');
}
function showBadge(msg,err){
  badge.textContent=msg;
  badge.className='badge show'+(err?' err':'');
}
function showBtn(label){
  if(label) btn.textContent=label;
  btn.classList.add('show');
}

/* ── Apri Web 7.0 ─────────────────────────────────────────── */
let _nodeUrl=null;
// Con il nodo acceso le pagine si aprono dal loro sito Freenet; altrimenti da quelle interne.
function openFromFreenet(){
  if(typeof Android==='undefined' || !Android.net){ openWeb7(); return; }
  setStatus('Apro Web 7.0 da Freenet',true);
  const go=()=>{
    if(!window.__fnToken){ setTimeout(go,50); return; }
    const id='p'+Date.now();
    const timer=setTimeout(()=>{ window.__fnReply=null; openWeb7(); },120000);
    window.__fnReply=(rid,json)=>{
      if(rid!==id) return;
      clearTimeout(timer);
      const r=JSON.parse(json);
      if(r.ok && /^[1-9A-HJ-NP-Za-km-z]{32,50}$/.test(r.key)) window.location.replace('http://127.0.0.1:7509/v1/contract/web/'+r.key+'/index.html');
      else openWeb7();
    };
    Android.net(window.__fnToken,'pagesPublish','{}',id);
  };
  go();
}

function openWeb7(){
  if(_nodeUrl && !_nodeUrl.includes('127.0.0.1') && !_nodeUrl.includes('localhost')){
    const ip=_nodeUrl.replace(/^https?:\/\//,'').split(':')[0];
    try{ localStorage.setItem('fn_remote_node',ip); }catch{}
  }
  const target=location.protocol==='file:'
    ?'file:///android_asset/index.html'
    :'./index.html';
  window.location.replace(target);
}

/* Android: lo stato del nodo arriva dal bridge Java. Valori: Manager.Status */
function bootAndroid(){
  setStatus('Avvio nodo Freenet',true);
  if(Android.startNode) Android.startNode();

  let retries=0;
  const MAX=25; // 25 secondi

  function poll(){
    retries++;
    const s=Android.getStatus ? Android.getStatus() : 'UNKNOWN';

    if(s==='STARTED'){
      showBadge('✓ Nodo Freenet attivo');
      setStatus('Connesso!');
      openFromFreenet();
      return;
    }
    if(s==='ERROR' || s==='PAUSED'){
      setStatus(s==='ERROR' ? 'Errore del nodo' : 'Nodo in pausa (rete o batteria)');
      showBadge('📴 Modalità offline — P2P non disponibile',true);
      showBtn('🚀 Apri Web 7.0');
      setTimeout(openWeb7,1500);
      return;
    }
    if(retries>=MAX){
      setStatus('Nodo non disponibile');
      showBadge('📴 Modalità offline — P2P non disponibile',true);
      showBtn('🚀 Apri Web 7.0');
      openWeb7();
      return;
    }
    const labels=[
      'Avvio nodo Freenet','Avvio nodo locale','Connessione peer',
      'Routing in corso','Sincronizzazione','Quasi pronto',
    ];
    setStatus(labels[Math.min(Math.floor(retries/5),labels.length-1)],true);
    setTimeout(poll,1000);
  }
  setTimeout(poll,800);
}

/* PC: senza bridge Java, l'unico modo di vedere il nodo è la sua API su loopback */
async function bootPC(){
  const LAN_NODES=['http://127.0.0.1:7509','http://127.0.0.1:8888'];
  try{
    const ip=localStorage.getItem('fn_remote_node');
    if(ip) LAN_NODES.push('http://'+ip+':7509');
  }catch{}

  setStatus('Verifica nodo locale',true);

  async function tryBase(base,ms){
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),ms);
    try{
      const r=await fetch(base+'/v1/version',{signal:ctrl.signal});
      clearTimeout(t);
      if(r.ok) return base;
    }catch{}
    clearTimeout(t);
    throw new Error('no');
  }

  function anyOf(ps){
    return new Promise((res,rej)=>{
      let left=ps.length;
      if(!left){rej();return;}
      ps.forEach(p=>p.then(res).catch(()=>{if(!--left)rej();}));
    });
  }

  try{
    const base=await anyOf(LAN_NODES.map(b=>tryBase(b,900)));
    _nodeUrl=base;
    showBadge('✓ Nodo attivo — '+base.replace('http://',''));
    setStatus('Connesso!');
    openWeb7();
  }catch{
    setStatus('Nodo Freenet non trovato');
    showBadge('⚠ Avvia il nodo Freenet e riprova',true);
    showBtn('🚀 Apri Web 7.0');
    openWeb7();
  }
}

/* ── Avvio ─────────────────────────────────────────────────── */
if(typeof Android!=='undefined' && Android.getStatus){
  bootAndroid();
}else{
  bootPC();
}

/* doppio tap per saltare */
let _lt=0;
document.body.addEventListener('touchend',()=>{
  const n=Date.now();
  if(n-_lt<400) openWeb7();
  _lt=n;
});
</script>
</body>
</html>
