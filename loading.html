<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web 7.0 — Avvio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#2ea44f;--green2:#3fb95f;--bg:#0d1117;--bg2:#161b22;--text:#f0f6fc;--text2:#8b949e}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}

/* sfondo animato */
.bg-anim{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg-anim span{position:absolute;border-radius:50%;filter:blur(80px);opacity:.18;animation:drift 8s infinite alternate ease-in-out}
.bg-anim span:nth-child(1){width:400px;height:400px;background:#2ea44f;top:-100px;left:-100px;animation-delay:0s}
.bg-anim span:nth-child(2){width:300px;height:300px;background:#1a7f37;bottom:-80px;right:-80px;animation-delay:-3s}
.bg-anim span:nth-child(3){width:200px;height:200px;background:#238636;top:50%;left:60%;animation-delay:-5s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,20px) scale(1.1)}}

.card{position:relative;z-index:1;text-align:center;padding:48px 40px;max-width:420px;width:90%}

/* logo */
.logo-wrap{display:inline-flex;align-items:center;gap:12px;margin-bottom:36px}
.logo-icon{width:48px;height:48px;background:var(--green);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 0 24px rgba(46,164,79,.5)}
.logo-text{font-size:28px;font-weight:700;letter-spacing:-1px}
.logo-text sup{font-size:14px;color:var(--green);font-weight:600;vertical-align:super}

.subtitle{font-size:14px;color:var(--text2);margin-bottom:48px;line-height:1.6}

/* timer */
.timer-ring{position:relative;width:160px;height:160px;margin:0 auto 32px}
.timer-ring svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg2);stroke-width:8}
.ring-fg{fill:none;stroke:var(--green);stroke-width:8;stroke-linecap:round;
  stroke-dasharray:439.8;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear,stroke .5s}
.timer-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-mm{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.timer-label{font-size:11px;color:var(--text2);margin-top:4px;letter-spacing:.05em;text-transform:uppercase}

/* barra progresso */
.prog-wrap{margin-bottom:12px}
.prog-bar{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));
  width:0%;transition:width .9s linear;border-radius:2px}
.prog-txt{font-size:12px;color:var(--text2);margin-top:8px}

/* stato */
.status{font-size:13px;color:var(--text2);margin-top:24px;min-height:20px}
.dot{display:inline-block;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}

/* button (finale) */
.btn-open{display:none;margin-top:32px;padding:14px 40px;border-radius:8px;
  background:var(--green);color:#fff;font-size:15px;font-weight:600;
  border:none;cursor:pointer;width:100%;transition:background .2s;letter-spacing:.02em}
.btn-open:hover{background:var(--green2)}
.btn-open.show{display:block;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="bg-anim"><span></span><span></span><span></span></div>

<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">🌐</div>
    <div class="logo-text">Web 7.0<sup>β</sup></div>
  </div>
  <div class="subtitle">
    Connessione alla rete Freenet P2P<br>
    Nodo in sincronizzazione — attendi qualche istante
  </div>

  <div class="timer-ring">
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle class="ring-bg" cx="80" cy="80" r="70"/>
      <circle class="ring-fg" id="ring" cx="80" cy="80" r="70"/>
    </svg>
    <div class="timer-num">
      <div class="timer-mm" id="tnum">3:00</div>
      <div class="timer-label">rimanenti</div>
    </div>
  </div>

  <div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill" id="pfill"></div></div>
    <div class="prog-txt" id="ptxt">0%</div>
  </div>

  <div class="status" id="status">
    Avvio nodo Freenet<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
  </div>

  <button class="btn-open" id="btn-open" onclick="openWeb7()">
    🚀 Apri Web 7.0
  </button>
</div>

<script>
const TOTAL = 180; // 3 minuti
const CIRC  = 2 * Math.PI * 70; // 439.8
const STEPS = [
  [0,   'Avvio nodo Freenet'],
  [20,  'Connessione ai peer'],
  [40,  'Sincronizzazione routing table'],
  [60,  'Verifica contratti locali'],
  [75,  'Caricamento Web 7.0'],
  [90,  'Quasi pronto'],
  [100, 'Pronto! Apertura in corso…'],
];

let elapsed = 0;
const ring  = document.getElementById('ring');
const tnum  = document.getElementById('tnum');
const pfill = document.getElementById('pfill');
const ptxt  = document.getElementById('ptxt');
const stEl  = document.getElementById('status');
const btnO  = document.getElementById('btn-open');

ring.style.strokeDasharray = CIRC;

function updateStatus(pct) {
  let msg = STEPS[0][1];
  for (const [p, m] of STEPS) { if (pct >= p) msg = m; }
  stEl.innerHTML = msg + (pct < 100
    ? '<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>'
    : '');
}

const iv = setInterval(() => {
  elapsed++;
  const pct  = Math.min((elapsed / TOTAL) * 100, 100);
  const left = Math.max(TOTAL - elapsed, 0);
  const mm   = Math.floor(left / 60);
  const ss   = String(left % 60).padStart(2, '0');

  tnum.textContent  = mm + ':' + ss;
  pfill.style.width = pct + '%';
  ptxt.textContent  = Math.floor(pct) + '%';

  // anello SVG: svuota man mano che il tempo passa
  const offset = CIRC * (elapsed / TOTAL);
  ring.style.strokeDashoffset = offset;

  // cambia colore quando siamo quasi alla fine
  if (pct > 85) ring.style.stroke = '#3fb95f';

  updateStatus(pct);

  if (elapsed >= TOTAL) {
    clearInterval(iv);
    ring.style.stroke = '#2ea44f';
    btnO.classList.add('show');
    // apertura automatica dopo 1 secondo
    setTimeout(openWeb7, 1000);
  }
}, 1000);

function openWeb7() {
  window.location.href = 'index.html';
}

// skip manuale: doppio click sul timer
document.querySelector('.timer-ring').addEventListener('dblclick', () => {
  clearInterval(iv);
  openWeb7();
});
</script>
</body>
</html>
