<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreenetGram — Web 7.0</title>
<link rel="stylesheet" href="web7.css">
<style>
.feed { max-width: 560px; margin: auto; }
.stories { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 8px; scrollbar-width: none; }
.story { flex-shrink: 0; width: 70px; text-align: center; font-size: 12px; cursor: pointer; }
.story .ring { width: 62px; height: 62px; margin: 0 auto 4px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, var(--accent), var(--teal)); }
.story img, .story .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg); }
.story span.name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
.post-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-width: 0; }
.post-img { width: 100%; background: var(--panel2); aspect-ratio: 1; object-fit: cover; }
.post-body { padding: 10px 12px; min-width: 0; }
.post-body p { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0; }
.squares { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; max-width: 760px; margin: auto; }
.squares a { aspect-ratio: 1; background: var(--panel2); display: block; }
.squares img { width: 100%; height: 100%; object-fit: cover; }
.fab { position: fixed; right: 16px; bottom: calc(var(--nav-h) + 16px); width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 26px; z-index: 15; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.viewer { position: fixed; inset: 0; background: #000; z-index: 40; display: flex; align-items: center; justify-content: center; }
.viewer img { max-width: 100%; max-height: 100%; }
.viewer .who { position: absolute; top: 12px; left: 14px; right: 14px; color: #fff; font-weight: 700; text-shadow: 0 1px 3px #000; }
@media (min-width: 900px) { .fab { bottom: 28px; right: 28px; } }
</style>
</head>
<body>
<header class="top">
  <a class="round" href="index.html" aria-label="Torna a Web 7.0">‹</a>
  <a class="brand" href="#/feed">◈ Freenet<b>Gram</b></a>
  <span class="grow"></span>
  <a href="#/me" id="me-avatar" aria-label="Il tuo profilo"></a>
</header>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main class="content" id="app"></main>
</div>
<nav class="bottom" id="bottom"></nav>
<button class="fab" onclick="location.hash='#/new'" aria-label="Nuova foto">＋</button>

<script src="fn-net.js"></script>
<script src="social.js"></script>
<script>
const { store, esc, timeAgo } = FNet;
const { toast, avatar, offlineNotice, drawComments, toggleVote } = Social;
const FEED = 'feed:photo';
const SITE = 'w70-gram';
const STORY_MS = 24 * 3600 * 1000;
const NAV = [['#/feed', '🏠', 'Home'], ['#/explore', '🔎', 'Esplora'], ['#/following', '👥', 'Seguiti'], ['#/me', '👤', 'Profilo']];
const app = document.getElementById('app');
let items = [];
let channels = new Map();

const photoUrl = p => (FNet.SAFE_KEY.test(p.ch || '') && /^[A-Za-z0-9_-]+\.jpg$/.test(p.file || '') ? FNet.siteUrl(p.ch, p.file) : '');
const follows = () => store.get('gram_follows', {});

async function refresh() {
  const [list, chans] = await Promise.all([FNet.readItems(FEED), FNet.readItems('feed:channels')]);
  items = list;
  channels = new Map(chans.map(c => [c.tag, c]));
  return list.online;
}
const visible = () => items.filter(FNet.isVisible);
const isStory = p => p.story && Date.now() - p.created < STORY_MS;

function photoCard(p) {
  return `<article class="post"><div class="post-head"><a href="#/user/${esc(p.tag)}" class="row grow">${avatar(p.name, channels.get(p.tag)?.avatar)}<span class="grow"><b style="overflow-wrap:anywhere">${esc(p.name)}</b><div class="sub">${esc(timeAgo(p.created))}</div></span></a>
      <button class="round" onclick="photoMenu('${esc(p.id)}')" aria-label="Altro">⋯</button></div>
    <img class="post-img" src="${esc(photoUrl(p))}" alt="${esc(p.caption || '')}" loading="lazy">
    <div class="post-body"><div class="row"><button class="btn" data-like="${esc(p.id)}" onclick="like(this)">❤️ <span>0</span></button><a class="btn" href="#/p/${esc(p.id)}">💬 Commenti</a></div>
      ${p.caption ? `<p><b>${esc(p.name)}</b> ${esc(p.caption)}</p>` : ''}</div></article>`;
}
async function fillLikes() {
  for (const b of document.querySelectorAll('[data-like]')) {
    try {
      const a = FNet.foldActivity(await FNet.read('c:' + b.dataset.like));
      b.querySelector('span').textContent = a.likes;
    } catch {}
  }
}
async function like(button) {
  const r = await toggleVote(button.dataset.like);
  button.querySelector('span').textContent = r.likes;
  button.classList.toggle('on', r.liked);
}
function storiesRow() {
  const latest = new Map();
  for (const p of visible().filter(isStory)) if (!latest.has(p.tag)) latest.set(p.tag, p);
  if (!latest.size) return '';
  return `<div class="stories">${[...latest.values()].map(p => `<div class="story" onclick="showStory('${esc(p.id)}')"><div class="ring">${avatar(p.name, channels.get(p.tag)?.avatar)}</div><span class="name">${esc(p.name)}</span></div>`).join('')}</div>`;
}
function showStory(id) {
  const p = items.find(x => x.id === id);
  if (!p) return;
  const v = document.createElement('div');
  v.className = 'viewer';
  v.innerHTML = `<div class="who">${esc(p.name)} · ${esc(timeAgo(p.created))}</div><img src="${esc(photoUrl(p))}" alt="">`;
  v.onclick = () => v.remove();
  document.body.append(v);
  setTimeout(() => v.remove(), 8000);
}
async function photoMenu(id) {
  const p = items.find(x => x.id === id);
  const me = await FNet.identity();
  if (p.author === me.pub) {
    if (!confirm('Eliminare questa foto?')) return;
    await FNet.deleteItem(FEED, id);
    try {
      await FNet.call('siteDeleteFile', { site: SITE, file: p.file });
      await FNet.publishSite(SITE);
      await FNet.removeFromChannel(id);
    } catch {}
    toast('Foto eliminata');
    render();
    return;
  }
  const choice = prompt('Scrivi 1 per segnalare la foto, 2 per bloccare questo utente');
  if (choice === '1') { await FNet.reportItem(FEED, id); toast('Segnalazione inviata'); }
  if (choice === '2') { FNet.blockUser(p.tag, p.name); toast('Utente bloccato'); render(); }
}

async function viewFeed() {
  const online = await refresh();
  const list = visible().filter(p => !p.story);
  app.innerHTML = `<div class="feed">${offlineNotice(online)}${storiesRow()}${list.length ? list.map(photoCard).join('')
    : '<div class="empty"><div>📸</div><h2>Ancora nessuna foto</h2><p>Pubblica la prima: resterà sulla rete Freenet.</p><a class="btn main" href="#/new">Pubblica una foto</a></div>'}</div>`;
  fillLikes();
}
async function viewFollowing() {
  const online = await refresh();
  const mine = follows();
  const list = visible().filter(p => mine[p.tag] && !p.story);
  app.innerHTML = `<div class="feed">${offlineNotice(online)}<h2 style="margin-bottom:12px">Seguiti</h2>${list.length ? list.map(photoCard).join('') : '<div class="empty"><div>👥</div><h2>Non segui ancora nessuno</h2><p>Apri un profilo e premi Segui.</p></div>'}</div>`;
  fillLikes();
}
function squares(list) {
  return `<div class="squares">${list.map(p => `<a href="#/p/${esc(p.id)}"><img src="${esc(photoUrl(p))}" alt="" loading="lazy"></a>`).join('')}</div>`;
}
async function viewExplore() {
  const online = await refresh();
  app.innerHTML = offlineNotice(online) + squares(visible().filter(p => !p.story));
}
async function viewUser(param) {
  await refresh();
  const me = await FNet.identity();
  const tag = param || me.tag;
  const own = tag === me.tag;
  const list = items.filter(p => p.tag === tag && (own || FNet.isVisible(p)) && !p.story);
  const name = own ? await FNet.displayName() : list[0]?.name || channels.get(tag)?.name || 'Profilo';
  const info = channels.get(tag) || {};
  const image = own ? FNet.profile().avatar : info.avatar;
  const bio = own ? FNet.profile().bio : info.bio;
  const followed = !!follows()[tag];
  app.innerHTML = `<div style="max-width:760px;margin:auto"><div class="row" style="margin-bottom:12px">${avatar(name, image, true)}<div class="grow"><h1 style="font-size:20px;overflow-wrap:anywhere">${esc(name)}</h1><div class="sub">${list.length} foto</div></div></div>
    <p style="white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px">${esc(bio || '')}</p>
    <div class="row wrap" style="margin-bottom:14px">${own ? '<a class="btn" href="video.html#/settings">Modifica profilo</a>' : `<button class="btn ${followed ? '' : 'main'}" onclick="toggleFollow('${esc(tag)}')">${followed ? 'Segui già' : 'Segui'}</button>`}</div>
    ${squares(list)}</div>`;
}
function toggleFollow(tag) {
  const f = follows();
  if (f[tag]) delete f[tag]; else f[tag] = true;
  store.set('gram_follows', f);
  render();
}
async function viewPhoto(id) {
  await refresh();
  const p = items.find(x => x.id === id);
  if (!p) { app.innerHTML = '<div class="empty"><div>🔎</div><h2>Foto non trovata</h2></div>'; return; }
  app.innerHTML = `<div class="feed">${photoCard(p)}<div class="panel" data-comments id="comments"></div></div>`;
  fillLikes();
  drawComments(document.getElementById('comments'), id);
}
function viewNew() {
  app.innerHTML = `<div class="panel" style="max-width:560px;margin:auto"><h2>Nuova foto</h2><form onsubmit="event.preventDefault();publish(this)">
    <label class="field"><span>Foto</span><input type="file" name="file" accept="image/*" required></label>
    <label class="field"><span>Didascalia</span><textarea name="caption" maxlength="1000"></textarea></label>
    <label class="switch" style="margin-bottom:12px"><span>Storia: sparisce dalle liste dopo 24 ore</span><input type="checkbox" name="story"></label>
    <button class="btn main" style="width:100%">Pubblica sulla rete Freenet</button></form><div class="sub" id="state" style="margin-top:10px"></div></div>`;
}
async function publish(form) {
  const state = document.getElementById('state');
  const button = form.querySelector('button');
  button.disabled = true;
  try {
    const id = FNet.newId('p');
    const file = id + '.jpg';
    state.textContent = 'Preparo la foto…';
    const blob = await FNet.imageToJpeg(form.file.files[0], 1600, 0.82);
    const existing = await FNet.call('siteRead', { site: SITE, file: 'index.html' });
    if (!existing.text) await FNet.writeText(SITE, 'index.html', '<!doctype html><meta charset="utf-8"><title>FreenetGram</title><p>Foto di FreenetGram.</p>');
    await FNet.writeBlob(SITE, file, blob);
    state.textContent = 'Pubblico sulla rete…';
    const ch = await FNet.publishSite(SITE);
    const caption = form.caption.value.trim();
    await FNet.publishMedia('photo', FEED, id, { ch, file, caption, story: form.story.checked, vis: 'public' }, { title: 'Foto', desc: caption, photo: { ch, file } });
    toast('Foto pubblicata');
    location.hash = '#/feed';
  } catch (e) {
    state.textContent = 'Pubblicazione non riuscita: ' + e.message;
    button.disabled = false;
  }
}

async function drawChrome() {
  document.getElementById('me-avatar').innerHTML = avatar(await FNet.displayName(), FNet.profile().avatar);
  const route = location.hash || '#/feed';
  const entry = ([hash, icon, label]) => `<a class="nav-item ${route.startsWith(hash) ? 'on' : ''}" href="${hash}"><span>${icon}</span><span>${label}</span></a>`;
  document.getElementById('side').innerHTML = NAV.map(entry).join('');
  document.getElementById('bottom').innerHTML = NAV.map(entry).join('');
}
async function render() {
  const [, page, arg] = (location.hash || '#/feed').match(/^#\/([a-z]+)\/?(.*)$/) || [null, 'feed', ''];
  const param = arg ? decodeURIComponent(arg) : '';
  drawChrome();
  try {
    if (page === 'explore') await viewExplore();
    else if (page === 'following') await viewFollowing();
    else if (page === 'me') await viewUser('');
    else if (page === 'user') await viewUser(param);
    else if (page === 'p') await viewPhoto(param);
    else if (page === 'new') viewNew();
    else await viewFeed();
  } catch (e) {
    app.innerHTML = `<div class="empty"><div>⚠️</div><h2>Qualcosa non ha funzionato</h2><p>${esc(e.message)}</p></div>`;
  }
}
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
