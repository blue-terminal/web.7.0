<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreenetGram — Web 7.0</title>
<link rel="stylesheet" href="web7.css">
<style>
.feed { max-width: 520px; margin: auto; }
.stories { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 14px; margin-bottom: 4px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.stories::-webkit-scrollbar { display: none; }
.story { flex-shrink: 0; width: 68px; text-align: center; font-size: 11px; cursor: pointer; }
.ring { width: 64px; height: 64px; margin: 0 auto 4px; border-radius: 50%; padding: 3px; background: conic-gradient(var(--accent), var(--teal), var(--accent)); }
.ring.seen { background: var(--line); }
.ring.add { background: var(--panel2); position: relative; }
.ring .avatar, .ring img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--bg); object-fit: cover; }
.ring.add::after { content: '+'; position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
.story span.name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post { margin: 10px 0 18px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.post-head { display: flex; align-items: center; gap: 10px; padding: 6px 4px; min-width: 0; }
.post-head .ring { width: 40px; height: 40px; margin: 0; padding: 2px; }
.carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; background: var(--panel2); border-radius: 6px; position: relative; }
.carousel::-webkit-scrollbar { display: none; }
.carousel > * { flex: 0 0 100%; scroll-snap-align: center; aspect-ratio: 4/5; width: 100%; object-fit: cover; }
.carousel .play { display: flex; align-items: center; justify-content: center; position: relative; background: #000; color: #fff; cursor: pointer; }
.carousel .play img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .8; }
.carousel .play span, .reel .play span { position: relative; width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; font-size: 28px; }
.carousel video { background: #000; object-fit: contain; }
.media-wrap { position: relative; }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.85); color: #111; font-size: 20px; line-height: 34px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); z-index: 2; }
.arrow.l { left: 8px; } .arrow.r { right: 8px; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet > div { background: var(--panel); width: 100%; max-width: 520px; border-radius: 14px 14px 0 0; padding: 8px 0 14px; }
.sheet button { display: block; width: 100%; padding: 14px; font-size: 16px; text-align: center; border-bottom: 1px solid var(--line); }
.sheet .danger { color: var(--danger); font-weight: 700; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
.filters button { flex: 0 0 auto; text-align: center; font-size: 12px; color: var(--muted); }
.filters button img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; display: block; margin-bottom: 4px; border: 2px solid transparent; }
.filters button.on { color: var(--text); font-weight: 700; } .filters button.on img { border-color: var(--accent); }
.picked { display: flex; gap: 6px; flex-wrap: wrap; }
.picked .one { position: relative; } .picked .one img, .picked .one video { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; display: block; }
.picked .one button { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.6); color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; }
.sources { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; }
.sources label { text-align: center; padding: 12px 4px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 13px; }
.sources label b { display: block; font-size: 24px; }
.viewer .trash { position: absolute; bottom: 20px; right: 16px; color: #fff; font-size: 15px; background: rgba(0,0,0,.5); padding: 8px 12px; border-radius: 18px; z-index: 3; }
.dots { display: flex; justify-content: center; gap: 4px; padding-top: 8px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.heart { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 96px; pointer-events: none; animation: pop .8s ease forwards; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 30% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
.bar-actions { display: flex; align-items: center; gap: 2px; padding: 4px 0; }
.bar-actions .round { font-size: 22px; }
.bar-actions .on { color: var(--danger); }
.likes { font-weight: 700; font-size: 14px; padding: 0 4px; }
.caption { padding: 4px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.more { padding: 2px 4px; color: var(--muted); font-size: 14px; display: block; }
.when { padding: 2px 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
.squares { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.squares a { aspect-ratio: 1; background: var(--panel2); display: block; position: relative; overflow: hidden; }
.squares img { width: 100%; height: 100%; object-fit: cover; }
.squares .kind { position: absolute; top: 6px; right: 6px; font-size: 14px; text-shadow: 0 1px 3px #000; }
.profile-top { display: flex; align-items: center; gap: 18px; margin-bottom: 12px; }
.counts { display: flex; flex: 1; justify-content: space-around; text-align: center; }
.counts b { display: block; font-size: 18px; }
.counts span { font-size: 13px; color: var(--muted); }
.tabs { display: flex; border-top: 1px solid var(--line); margin-top: 14px; }
.tab { flex: 1; padding: 10px; text-align: center; color: var(--muted); font-size: 18px; border-top: 2px solid transparent; }
.tab.on { color: var(--text); border-top-color: var(--text); }
.viewer { position: fixed; inset: 0; background: #000; z-index: 40; display: flex; align-items: center; justify-content: center; }
.viewer img { max-width: 100%; max-height: 100%; }
.viewer .bars { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 4px; }
.viewer .bars i { flex: 1; height: 3px; background: rgba(255,255,255,.35); border-radius: 2px; overflow: hidden; }
.viewer .bars i b { display: block; height: 100%; width: 0; background: #fff; }
.viewer .who { position: absolute; top: 22px; left: 14px; right: 50px; color: #fff; font-weight: 700; text-shadow: 0 1px 3px #000; display: flex; gap: 8px; align-items: center; }
.viewer .close { position: absolute; top: 16px; right: 12px; color: #fff; font-size: 26px; }
.viewer .zone { position: absolute; top: 60px; bottom: 0; width: 40%; }
.reels { max-width: 480px; margin: auto; }
.reel { position: relative; aspect-ratio: 9/16; max-height: calc(100vh - var(--top-h) - var(--nav-h) - 24px); margin: 0 auto 14px; background: #000; border-radius: var(--radius); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.reel .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; }
.reel .play img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .8; }
.reel video { width: 100%; height: 100%; object-fit: contain; }
.reel .info { position: absolute; left: 12px; right: 64px; bottom: 14px; color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; }
.reel .side-actions { position: absolute; right: 8px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; color: #fff; }
.reel .side-actions .round { color: #fff; font-size: 26px; text-shadow: 0 1px 3px #000; }
.reel .side-actions small { font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px #000; }
.picked { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.picked img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
</style>
</head>
<body>
<header class="top">
  <a class="round" href="index.html" aria-label="Torna a Web 7.0">‹</a>
  <a class="brand" href="#/feed">◈ Freenet<b>Gram</b></a>
  <span class="grow"></span>
  <a class="round" href="#/activity" aria-label="Attività">♡</a>
  <a class="round only-wide" href="#/new" aria-label="Nuovo post">＋</a>
</header>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main class="content" id="app"></main>
</div>
<nav class="bottom" id="bottom"></nav>

<script src="fn-ws.js"></script>
<script src="fn-net.js"></script>
<script src="social.js"></script>
<script>
const { store, esc, timeAgo } = FNet;
const { toast, avatar, offlineNotice, drawComments, toggleVote, imageUrl } = Social;
const FEED = 'feed:photo';
const SITE = 'w70-gram';
const MAX_IMAGES = 10;
const STORY_MS = 24 * 3600 * 1000;
const STORY_SHOW_MS = 5000;
const NAV = [['#/feed', '🏠', 'Home'], ['#/explore', '🔎', 'Cerca'], ['#/new', '＋', 'Nuovo'], ['#/reels', '🎬', 'Reels'], ['#/me', '👤', 'Profilo']];
const app = document.getElementById('app');
let items = [];
let channels = new Map();
let me = null;

const follows = () => store.get('gram_follows', {});
const saved = () => store.get('gram_saved', []);
const seenStories = () => store.get('gram_seen', {});
const mediaOf = p => (Array.isArray(p.media) ? p.media.filter(m => m && (m.type === 'video' || imageUrl(m))) : []);
const videoOf = p => mediaOf(p).find(m => m.type === 'video');
const isStory = p => p.story && Date.now() - p.created < STORY_MS;
const visible = () => items.filter(FNet.isVisible).filter(p => mediaOf(p).length);
const posts = () => visible().filter(p => !p.story);

async function refresh() {
  const [list, chans] = await Promise.all([FNet.readItems(FEED), FNet.readItems('feed:channels')]);
  items = list;
  channels = new Map(chans.map(c => [c.tag, c]));
  me = me || await FNet.identity();
  return list.online;
}
const avatarOf = tag => channels.get(tag)?.avatar;
const imgTag = (m, cls) => `<img class="${cls || ''}" data-src="${esc(imageUrl(m))}" data-sha="${esc(m.sha || '')}" alt="">`;
function thumbOf(p) {
  const v = videoOf(p);
  if (v) return FNet.safeImage(v.thumb) ? `<img src="${FNet.safeImage(v.thumb)}" alt="">` : '';
  return imgTag(mediaOf(p)[0]);
}

// ── post ───────────────────────────────────────────────────────────────────
function mediaHtml(p) {
  const media = mediaOf(p);
  const video = videoOf(p);
  const slides = media.map((m, i) => m.type === 'video'
    ? `<div class="play" onclick="playInline('${esc(p.id)}',this,${i})">${FNet.safeImage(m.thumb) ? `<img src="${FNet.safeImage(m.thumb)}" alt="">` : ''}<span>▶</span></div>`
    : imgTag(m)).join('');
  const many = media.length > 1;
  const dots = many ? `<div class="dots">${media.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : '';
  const arrows = many ? '<button class="arrow l" onclick="slide(this,-1)" aria-label="Precedente" hidden>‹</button><button class="arrow r" onclick="slide(this,1)" aria-label="Successiva">›</button>' : '';
  return `<div class="media-wrap" data-media="${esc(p.id)}"><div class="carousel" onscroll="moveDots(this)">${slides}</div>${arrows}</div>${dots}`;
}
// Frecce del carosello: una foto alla volta, come scorrendo col dito.
function slide(button, dir) {
  const c = button.parentElement.querySelector('.carousel');
  c.scrollBy({ left: dir * c.clientWidth, behavior: 'smooth' });
}
function moveDots(el) {
  const dots = el.parentElement.nextElementSibling;
  const i = Math.round(el.scrollLeft / el.clientWidth);
  const wrap = el.parentElement;
  const l = wrap.querySelector('.arrow.l'), r = wrap.querySelector('.arrow.r');
  if (l) l.hidden = i <= 0;
  if (r) r.hidden = i >= el.children.length - 1;
  if (!dots || !dots.classList.contains('dots')) return;
  [...dots.children].forEach((d, n) => d.classList.toggle('on', n === i));
}
function postHtml(p) {
  const hasStory = visible().some(x => x.tag === p.tag && isStory(x));
  const isSaved = saved().includes(p.id);
  return `<article class="post" data-post="${esc(p.id)}">
    <div class="post-head"><a href="#/user/${esc(p.tag)}" class="row grow"><span class="ring ${hasStory ? '' : 'seen'}">${avatar(p.name, avatarOf(p.tag))}</span><b class="grow" style="overflow-wrap:anywhere">${esc(p.name)}</b></a>
      <button class="round" onclick="postMenu('${esc(p.id)}')" aria-label="Altro">⋯</button></div>
    ${mediaHtml(p)}
    <div class="bar-actions">
      <button class="round" data-like="${esc(p.id)}" onclick="like(this)" aria-label="Mi piace">♡</button>
      <a class="round" href="#/p/${esc(p.id)}" aria-label="Commenti">💬</a>
      <button class="round" onclick="share('${esc(p.id)}')" aria-label="Condividi">↗</button>
      <span class="grow"></span>
      <button class="round" onclick="toggleSave('${esc(p.id)}',this)" aria-label="Salva">${isSaved ? '🔖' : '📑'}</button>
    </div>
    <div class="likes" data-likes="${esc(p.id)}"></div>
    ${p.caption ? `<div class="caption"><b>${esc(p.name)}</b> ${esc(p.caption)}</div>` : ''}
    <a class="more" href="#/p/${esc(p.id)}" data-comments-link="${esc(p.id)}"></a>
    <div class="when">${esc(timeAgo(p.created))}</div></article>`;
}
async function fillCounts(root) {
  for (const b of (root || app).querySelectorAll('[data-like]')) {
    try {
      const a = FNet.foldActivity(await FNet.read('c:' + b.dataset.like));
      const liked = a.votes.get(me.pub) === 1;
      b.textContent = liked ? '❤️' : '♡';
      b.classList.toggle('on', liked);
      const likes = document.querySelector(`[data-likes="${b.dataset.like}"]`);
      if (likes) likes.textContent = a.likes ? (a.likes === 1 ? 'Piace a 1 persona' : `Piace a ${a.likes} persone`) : '';
      const more = document.querySelector(`[data-comments-link="${b.dataset.like}"]`);
      if (more) more.textContent = a.comments.length ? `Mostra ${a.comments.length === 1 ? 'il commento' : `tutti i ${a.comments.length} commenti`}` : 'Aggiungi un commento…';
      const small = document.querySelector(`[data-likes-small="${b.dataset.like}"]`);
      if (small) small.textContent = a.likes;
    } catch {}
  }
}
async function like(button) {
  const r = await toggleVote(button.dataset.like);
  button.textContent = r.liked ? '❤️' : '♡';
  button.classList.toggle('on', r.liked);
  fillCounts(button.closest('[data-post],.reel') || app);
}
// Doppio tocco sulla foto: "mi piace", con il cuore che compare.
let lastTap = { id: null, t: 0 };
document.addEventListener('click', e => {
  const box = e.target.closest('[data-media]');
  if (!box || e.target.closest('.play') || e.target.tagName === 'VIDEO') return;
  const id = box.dataset.media, now = Date.now();
  if (lastTap.id === id && now - lastTap.t < 350) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = '❤️';
    box.append(heart);
    setTimeout(() => heart.remove(), 800);
    const button = document.querySelector(`[data-like="${id}"]`);
    if (button && !button.classList.contains('on')) like(button);
  }
  lastTap = { id, t: now };
});
async function playInline(id, el, index) {
  const p = items.find(x => x.id === id);
  const label = el.querySelector('span');
  label.textContent = '…';
  try {
    const blob = await FNet.downloadVideo(index == null ? videoOf(p) : mediaOf(p)[index], (got, total) => { label.textContent = total ? Math.round(got / total * 100) + '%' : '…'; });
    const v = document.createElement('video');
    v.controls = true;
    v.playsInline = true;
    v.loop = true;
    v.src = URL.createObjectURL(blob);
    el.replaceWith(v);
    v.play().catch(() => {});
  } catch (e) { label.textContent = '!'; toast(e.message); }
}
async function share(id) {
  const p = items.find(x => x.id === id);
  const text = `${p.name} su FreenetGram: ${(p.caption || '').slice(0, 80)} — codice ${p.id}`;
  try { await navigator.clipboard.writeText(text); toast('Copiato'); } catch { toast(text); }
}
function toggleSave(id, button) {
  const now = !saved().includes(id);
  const list = saved().filter(x => x !== id);
  if (now) list.unshift(id);
  store.set('gram_saved', list);
  button.textContent = now ? '🔖' : '📑';
  toast(now ? 'Salvato' : 'Tolto dai salvati');
}
function sheet(choices) {
  return new Promise(done => {
    const box = document.createElement('div');
    box.className = 'sheet';
    box.innerHTML = '<div>' + choices.map(([key, label, cls]) => `<button data-k="${key}" class="${cls || ''}">${esc(label)}</button>`).join('') + '<button data-k="">Annulla</button></div>';
    box.onclick = e => { const b = e.target.closest('button'); if (b || e.target === box) { box.remove(); done(b ? b.dataset.k : ''); } };
    document.body.append(box);
  });
}
async function deletePost(p) {
  if (!confirm(isStory(p) ? 'Eliminare questa storia?' : 'Eliminare questo post?')) return false;
  await FNet.deleteItem(FEED, p.id);
  try {
    for (const m of mediaOf(p)) if (m.type === 'video') await FNet.wipeVideoParts(m.parts || []);
    const photos = mediaOf(p).filter(m => m.type !== 'video');
    for (const m of photos) await FNet.call('siteDeleteFile', { site: SITE, file: m.file });
    if (photos.length) await FNet.publishSite(SITE);
    await FNet.removeFromChannel(p.id);
  } catch {}
  toast(isStory(p) ? 'Storia eliminata' : 'Post eliminato');
  return true;
}
async function editCaption(p) {
  const text = prompt('Nuova didascalia', p.caption || '');
  if (text === null) return;
  await FNet.saveItem(FEED, p.id, { media: p.media, caption: text.trim().slice(0, 2200), story: !!p.story, vis: p.vis || 'public' });
  toast('Didascalia aggiornata');
  render();
}
async function postMenu(id) {
  const p = items.find(x => x.id === id);
  if (p.author === me.pub) {
    const k = await sheet([['edit', 'Modifica didascalia'], ['link', 'Copia codice del post'], ['del', 'Elimina', 'danger']]);
    if (k === 'edit') editCaption(p);
    if (k === 'link') share(id);
    if (k === 'del' && await deletePost(p)) render();
    return;
  }
  const k = await sheet([['rep', 'Segnala', 'danger'], ['block', 'Blocca ' + p.name, 'danger'], ['link', 'Copia codice del post']]);
  if (k === 'rep') { await FNet.reportItem(FEED, id); toast('Segnalazione inviata'); }
  if (k === 'block') { FNet.blockUser(p.tag, p.name); toast('Utente bloccato'); render(); }
  if (k === 'link') share(id);
}

// ── storie ─────────────────────────────────────────────────────────────────
function storyGroups() {
  const groups = new Map();
  for (const p of visible().filter(isStory).sort((a, b) => a.created - b.created)) {
    if (!groups.has(p.tag)) groups.set(p.tag, []);
    groups.get(p.tag).push(p);
  }
  // Prima la tua, poi chi segui, poi gli altri.
  const rank = tag => (tag === me.tag ? 0 : follows()[tag] ? 1 : 2);
  return new Map([...groups.entries()].sort((a, b) => rank(a[0]) - rank(b[0])));
}
function storiesRow() {
  const groups = storyGroups();
  const seen = seenStories();
  const mine = groups.get(me.tag);
  const others = [...groups.entries()].filter(([tag]) => tag !== me.tag);
  const bubble = (tag, list, label) => {
    const allSeen = list.every(p => seen[p.id]);
    return `<div class="story" onclick="openStories('${esc(tag)}')"><div class="ring ${allSeen ? 'seen' : ''}">${avatar(list[0].name, avatarOf(tag))}</div><span class="name">${esc(label)}</span></div>`;
  };
  const addMine = `<div class="story" onclick="location.hash='#/new/storia'"><div class="ring add">${avatar('Tu', FNet.profile().avatar)}</div><span class="name">La tua storia</span></div>`;
  return `<div class="stories">${mine ? bubble(me.tag, mine, 'La tua storia') : addMine}
    ${others.map(([tag, list]) => bubble(tag, list, list[0].name)).join('')}</div>`;
}
function openStories(startTag) {
  const groups = [...storyGroups().entries()];
  let g = Math.max(0, groups.findIndex(([tag]) => tag === startTag));
  let i = 0, timer = null;
  const v = document.createElement('div');
  v.className = 'viewer';
  document.body.append(v);
  const close = () => { clearTimeout(timer); v.remove(); render(); };
  const show = () => {
    if (g >= groups.length) { close(); return; }
    const [tag, list] = groups[g];
    if (i < 0) { g--; if (g < 0) { g = 0; i = 0; } else i = groups[g][1].length - 1; show(); return; }
    if (i >= list.length) { g++; i = 0; show(); return; }
    const p = list[i];
    const seen = seenStories();
    seen[p.id] = 1;
    store.set('gram_seen', seen);
    v.innerHTML = `<div class="bars">${list.map((_, n) => `<i><b style="width:${n < i ? 100 : 0}%"></b></i>`).join('')}</div>
      <div class="who">${avatar(p.name, avatarOf(tag))}<span>${esc(p.name)} · ${esc(timeAgo(p.created))}</span></div>
      <button class="close" aria-label="Chiudi">✕</button>${imgTag(mediaOf(p)[0])}
      ${p.author === me.pub ? '<button class="trash">🗑 Elimina</button>' : ''}
      <div class="zone" style="left:0"></div><div class="zone" style="right:0"></div>`;
    FNet.loadVerifiedImages(v);
    v.querySelector('.close').onclick = close;
    const trash = v.querySelector('.trash');
    if (trash) trash.onclick = async () => { clearTimeout(timer); if (await deletePost(p)) close(); else timer = setTimeout(() => { i++; show(); }, STORY_SHOW_MS); };
    v.querySelectorAll('.zone')[0].onclick = () => { clearTimeout(timer); i--; show(); };
    v.querySelectorAll('.zone')[1].onclick = () => { clearTimeout(timer); i++; show(); };
    const bar = v.querySelectorAll('.bars b')[i];
    bar.style.transition = `width ${STORY_SHOW_MS}ms linear`;
    requestAnimationFrame(() => { bar.style.width = '100%'; });
    clearTimeout(timer);
    timer = setTimeout(() => { i++; show(); }, STORY_SHOW_MS);
  };
  show();
}

// ── pagine ─────────────────────────────────────────────────────────────────
async function viewFeed() {
  const online = await refresh();
  const mine = follows();
  const all = posts();
  const followed = all.filter(p => mine[p.tag] || p.tag === me.tag);
  const list = followed.length >= 3 ? followed : all;
  app.innerHTML = `<div class="feed">${offlineNotice(online)}${storiesRow()}${list.length ? list.map(postHtml).join('')
    : '<div class="empty"><div>📸</div><h2>Ancora nessun post</h2><p>Pubblica la prima foto o il primo video: resterà sulla rete Freenet.</p><a class="btn main" href="#/new">Nuovo post</a></div>'}</div>`;
  fillCounts();
}
function squares(list) {
  return `<div class="squares">${list.map(p => `<a href="#/p/${esc(p.id)}">${thumbOf(p)}${videoOf(p) ? '<span class="kind">🎬</span>' : mediaOf(p).length > 1 ? '<span class="kind">❐</span>' : ''}</a>`).join('')}</div>`;
}
let exploreQuery = '';
async function viewExplore() {
  const online = await refresh();
  const q = exploreQuery.toLowerCase();
  const list = posts().filter(p => !q || `${p.caption} ${p.name}`.toLowerCase().includes(q));
  app.innerHTML = `<div class="feed" style="max-width:760px">${offlineNotice(online)}
    <form class="search" style="margin-bottom:12px" onsubmit="event.preventDefault();exploreQuery=this.q.value.trim();render()"><input name="q" type="search" placeholder="Cerca" value="${esc(exploreQuery)}" aria-label="Cerca"></form>
    ${list.length ? squares(list) : '<p class="sub">Niente da mostrare.</p>'}</div>`;
}
async function viewReels() {
  const online = await refresh();
  const list = posts().filter(videoOf);
  app.innerHTML = `<div class="reels">${offlineNotice(online)}${list.length ? list.map(p => `<div class="reel" data-post="${esc(p.id)}">
      <div class="play" onclick="playReel('${esc(p.id)}',this)">${FNet.safeImage(videoOf(p).thumb) ? `<img src="${FNet.safeImage(videoOf(p).thumb)}" alt="">` : ''}<span>▶</span></div>
      <div class="info"><b>${esc(p.name)}</b><div style="overflow-wrap:anywhere">${esc(p.caption || '')}</div></div>
      <div class="side-actions"><button class="round" data-like="${esc(p.id)}" onclick="like(this)" aria-label="Mi piace">♡</button><small data-likes-small="${esc(p.id)}">0</small>
        <a class="round" href="#/p/${esc(p.id)}" aria-label="Commenti">💬</a><button class="round" onclick="share('${esc(p.id)}')" aria-label="Condividi">↗</button></div></div>`).join('')
    : '<div class="empty"><div>🎬</div><h2>Ancora nessun reel</h2><p>Pubblica un video breve dal pulsante ＋.</p></div>'}</div>`;
  fillCounts();
}
async function playReel(id, el) {
  const p = items.find(x => x.id === id);
  const label = el.querySelector('span');
  label.textContent = '…';
  try {
    const blob = await FNet.downloadVideo(videoOf(p), (got, total) => { label.textContent = total ? Math.round(got / total * 100) + '%' : '…'; });
    const v = document.createElement('video');
    v.playsInline = true;
    v.loop = true;
    v.src = URL.createObjectURL(blob);
    v.onclick = () => (v.paused ? v.play() : v.pause());
    el.replaceWith(v);
    v.play().catch(() => {});
  } catch (e) { label.textContent = '!'; toast(e.message); }
}
let profileTab = 'grid';
async function viewUser(param) {
  await refresh();
  const tag = param || me.tag;
  const own = tag === me.tag;
  const list = items.filter(p => p.tag === tag && (own || FNet.isVisible(p)) && !p.story && mediaOf(p).length);
  const info = channels.get(tag) || {};
  const name = own ? await FNet.displayName() : list[0]?.name || info.name || 'Profilo';
  const followed = !!follows()[tag];
  const byId = new Map(items.map(p => [p.id, p]));
  const shown = profileTab === 'saved' && own ? saved().map(id => byId.get(id)).filter(Boolean) : list;
  app.innerHTML = `<div class="feed" style="max-width:760px">
    <div class="profile-top"><span class="ring ${visible().some(p => p.tag === tag && isStory(p)) ? '' : 'seen'}" style="width:86px;height:86px">${avatar(name, own ? FNet.profile().avatar : info.avatar, true)}</span>
      <div class="counts"><div><b>${list.length}</b><span>post</span></div><div><b id="followers">…</b><span>follower</span></div>${own ? `<div><b>${Object.keys(follows()).length}</b><span>seguiti</span></div>` : ''}</div></div>
    <b style="overflow-wrap:anywhere">${esc(name)}</b>
    <p style="white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 12px">${esc(own ? FNet.profile().bio : info.bio || '')}</p>
    <div class="row">${own ? '<a class="btn grow" href="video.html#/settings">Modifica profilo</a><a class="btn grow" href="#/new/storia">Aggiungi storia</a>' : `<button class="btn grow ${followed ? '' : 'main'}" onclick="toggleFollow('${esc(tag)}')">${followed ? 'Segui già' : 'Segui'}</button>${list[0] ? `<a class="btn grow" href="posts.html#/dm/${esc(list[0].author)}">✉️ Messaggio</a>` : ''}`}</div>
    <div class="tabs"><button class="tab ${profileTab === 'grid' ? 'on' : ''}" onclick="profileTab='grid';render()" aria-label="Post">▦</button>${own ? `<button class="tab ${profileTab === 'saved' ? 'on' : ''}" onclick="profileTab='saved';render()" aria-label="Salvati">🔖</button>` : ''}</div>
    ${shown.length ? squares(shown) : '<p class="sub" style="padding:20px 0;text-align:center">Nessun post.</p>'}</div>`;
  const msgs = await FNet.read('gram:f:' + tag);
  const latest = new Map();
  for (const m of msgs) if (m.k === 'follow') latest.set(m.author, m.on === true);
  const el = document.getElementById('followers');
  if (el) el.textContent = [...latest.values()].filter(Boolean).length;
}
async function toggleFollow(tag) {
  const f = follows();
  const on = !f[tag];
  if (on) f[tag] = true; else delete f[tag];
  store.set('gram_follows', f);
  await FNet.post('gram:f:' + tag, 'follow', { on });
  render();
}
async function viewPost(id) {
  await refresh();
  const p = items.find(x => x.id === id);
  if (!p) { app.innerHTML = '<div class="empty"><div>🔎</div><h2>Post non trovato</h2></div>'; return; }
  app.innerHTML = `<div class="feed">${postHtml(p)}<div class="panel" data-comments id="comments"></div></div>`;
  fillCounts();
  drawComments(document.getElementById('comments'), id);
}
async function viewActivity() {
  await refresh();
  const mine = posts().filter(p => p.tag === me.tag).slice(0, 12);
  app.innerHTML = '<div class="feed"><h2 style="margin-bottom:10px">Attività</h2><div id="act"><p class="sub">Leggo dalla rete…</p></div></div>';
  const rows = [];
  for (const p of mine) {
    for (const m of await FNet.read('c:' + p.id)) {
      if (m.author === me.pub) continue;
      if (m.k === 'vote' && m.value === 1) rows.push({ m, p, text: 'ha messo mi piace al tuo post' });
      if (m.k === 'comment') rows.push({ m, p, text: `ha commentato: ${String(m.text).slice(0, 120)}` });
    }
  }
  rows.sort((a, b) => b.m.time - a.m.time);
  const box = document.getElementById('act');
  if (box) box.innerHTML = rows.length ? rows.map(r => `<a class="row" style="padding:8px 0" href="#/p/${esc(r.p.id)}">${avatar(r.m.name)}<span class="grow" style="overflow-wrap:anywhere"><b>${esc(r.m.name)}</b> ${esc(r.text)} <span class="sub">${esc(timeAgo(r.m.time))}</span></span><span style="width:44px;height:44px;flex-shrink:0;overflow:hidden;border-radius:4px">${thumbOf(r.p)}</span></a>`).join('') : '<p class="sub">Nessuna attività sui tuoi post.</p>';
  if (box) FNet.loadVerifiedImages(box);
}
// Filtri come gli effetti della fotocamera: si vedono subito e restano nella foto pubblicata.
const FILTERS = [['Normale', 'none'], ['Caldo', 'sepia(.35) saturate(1.4) hue-rotate(-10deg)'], ['Freddo', 'saturate(1.1) hue-rotate(20deg) brightness(1.05)'],
  ['B/N', 'grayscale(1) contrast(1.15)'], ['Vintage', 'sepia(.6) contrast(.9) brightness(1.08)'], ['Vivace', 'saturate(1.8) contrast(1.1)'],
  ['Sogno', 'brightness(1.15) saturate(1.3) blur(.6px)'], ['Notte', 'brightness(.85) contrast(1.3) hue-rotate(200deg) saturate(.7)']];
let picked = [], filter = 'none';
function viewNew(kind) {
  const story = kind === 'storia';
  picked = []; filter = 'none';
  app.innerHTML = `<div class="panel" style="max-width:520px;margin:auto"><h2>${story ? 'Nuova storia' : 'Nuovo post'}</h2><form onsubmit="event.preventDefault();publish(this)">
    <p class="sub">${story ? 'Una foto, resta 24 ore' : `Fino a ${MAX_IMAGES} foto e un video nello stesso post`}</p>
    <div class="sources">
      <label><b>📷</b>Scatta foto<input type="file" accept="image/*" capture="environment" hidden onchange="addPicked(this,${story})"></label>
      ${story ? '' : '<label><b>🎥</b>Registra video<input type="file" accept="video/*" capture="environment" hidden onchange="addPicked(this,false)"></label>'}
      <label><b>🖼️</b>Galleria<input type="file" accept="${story ? 'image/*' : 'image/*,video/*'}" ${story ? '' : 'multiple'} hidden onchange="addPicked(this,${story})"></label>
    </div>
    <div class="picked" id="picked"></div>
    <div class="filters" id="filters" hidden></div>
    ${story ? '' : '<label class="field"><span>Didascalia</span><textarea name="caption" maxlength="2200"></textarea></label>'}
    <input type="hidden" name="story" value="${story ? 1 : ''}">
    <button class="btn main" style="width:100%">Condividi sulla rete Freenet</button></form><div class="sub" id="state" style="margin-top:10px"></div></div>`;
}
function addPicked(input, single) {
  for (const f of input.files) {
    if (f.type.startsWith('video/')) { picked = picked.filter(x => !x.type.startsWith('video/')); picked.push(f); }
    else if (f.type.startsWith('image/')) picked.push(f);
  }
  if (single) picked = picked.slice(-1);
  const photos = picked.filter(f => f.type.startsWith('image/'));
  if (photos.length > MAX_IMAGES) { toast(`Al massimo ${MAX_IMAGES} foto`); picked = picked.filter(f => !photos.slice(MAX_IMAGES).includes(f)); }
  input.value = '';
  drawPicked();
}
function drawPicked() {
  document.getElementById('picked').innerHTML = picked.map((f, i) => `<div class="one">${f.type.startsWith('image/') ? `<img src="${URL.createObjectURL(f)}" style="filter:${filter}" alt="">` : `<video src="${URL.createObjectURL(f)}" muted playsinline></video>`}<button type="button" onclick="picked.splice(${i},1);drawPicked()" aria-label="Togli">✕</button></div>`).join('');
  const first = picked.find(f => f.type.startsWith('image/'));
  const box = document.getElementById('filters');
  box.hidden = !first;
  if (first) {
    const url = URL.createObjectURL(first);
    box.innerHTML = FILTERS.map(([name, css], n) => `<button type="button" class="${css === filter ? 'on' : ''}" onclick="filter=FILTERS[${n}][1];drawPicked()"><img src="${url}" style="filter:${css}" alt="">${name}</button>`).join('');
  }
}
// Applica il filtro scelto ai pixel, così chi guarda vede la foto come l'hai vista tu.
function withFilter(file) {
  if (filter === 'none' || !file.type.startsWith('image/')) return Promise.resolve(file);
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const g = c.getContext('2d');
      g.filter = filter;
      g.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(new File([b], 'foto.jpg', { type: 'image/jpeg' })) : rej(new Error('Immagine non valida')), 'image/jpeg', 0.9);
    };
    img.onerror = () => rej(new Error('Immagine non valida'));
    img.src = URL.createObjectURL(file);
  });
}
async function publish(form) {
  const state = document.getElementById('state');
  const button = form.querySelector('button.main');
  button.disabled = true;
  try {
    if (!picked.length) throw new Error('Scegli una foto o un video');
    const id = FNet.newId('p');
    const files = await Promise.all(picked.map(withFilter));
    const media = await Social.uploadMedia(files, id, SITE, t => { state.textContent = t; }, MAX_IMAGES);
    if (!media.length) throw new Error('Scegli una foto o un video');
    const caption = form.caption ? form.caption.value.trim() : '';
    state.textContent = 'Pubblico il post';
    await FNet.publishMedia('photo', FEED, id, { media, caption, story: !!form.story.value, vis: 'public' }, { title: 'Foto', desc: caption, media: media.map(m => m.type) });
    toast(form.story.value ? 'Storia pubblicata' : 'Post pubblicato');
    location.hash = '#/feed';
  } catch (e) {
    state.textContent = 'Pubblicazione non riuscita: ' + e.message;
    button.disabled = false;
  }
}

async function drawChrome() {
  const route = location.hash || '#/feed';
  const entry = ([hash, icon, label]) => `<a class="nav-item ${route.startsWith(hash) ? 'on' : ''}" href="${hash}"><span>${icon}</span><span>${label}</span></a>`;
  document.getElementById('side').innerHTML = NAV.map(entry).join('');
  document.getElementById('bottom').innerHTML = NAV.map(entry).join('');
}
async function render() {
  const [, page, arg] = (location.hash || '#/feed').match(/^#\/([a-z]+)\/?(.*)$/) || [null, 'feed', ''];
  const param = arg ? decodeURIComponent(arg) : '';
  drawChrome();
  try {
    if (page === 'explore') await viewExplore();
    else if (page === 'reels') await viewReels();
    else if (page === 'me') await viewUser('');
    else if (page === 'user') await viewUser(param);
    else if (page === 'p') await viewPost(param);
    else if (page === 'activity') await viewActivity();
    else if (page === 'new') viewNew(param);
    else await viewFeed();
    FNet.loadVerifiedImages(app);
  } catch (e) {
    app.innerHTML = `<div class="empty"><div>⚠️</div><h2>Qualcosa non ha funzionato</h2><p>${esc(e.message)}</p></div>`;
  }
}
addEventListener('hashchange', render);
render();
</script>
