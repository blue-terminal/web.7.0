<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreenetPosts — Web 7.0</title>
<link rel="stylesheet" href="web7.css">
<style>
.column { max-width: 600px; margin: auto; }
.compose textarea { width: 100%; min-height: 70px; padding: 10px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; outline: none; resize: vertical; }
.compose .row { margin-top: 8px; }
.attach { cursor: pointer; }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
.note-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-width: 0; }
.note-text { padding: 0 12px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.media { display: grid; gap: 2px; background: var(--panel2); position: relative; }
.media.n2, .media.n3, .media.n4 { grid-template-columns: 1fr 1fr; }
.media img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1; }
.media.n1 img { aspect-ratio: auto; max-height: 560px; object-fit: contain; background: #000; }
.media.n3 img:first-child { grid-row: span 2; aspect-ratio: auto; }
.media .play { aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; position: relative; background: #000; color: #fff; cursor: pointer; }
.media .play img { position: absolute; inset: 0; opacity: .75; aspect-ratio: auto; }
.media .play span { position: relative; width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; font-size: 28px; }
.media video { width: 100%; max-height: 560px; background: #000; display: block; }
.heart { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 90px; pointer-events: none; animation: pop 0.8s ease forwards; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 30% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
.note-actions { display: flex; gap: 4px; padding: 6px 8px; align-items: center; }
.note-actions .round { font-size: 20px; }
.note-actions .count { font-size: 13px; font-weight: 700; margin-right: 6px; }
.note-actions .on { color: var(--danger); }
.quote { display: block; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 0 12px 10px; }
.preview { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.preview img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
</style>
</head>
<body>
<header class="top">
  <a class="round" href="index.html" aria-label="Torna a Web 7.0">‹</a>
  <a class="brand" href="#/all">◈ Freenet<b>Posts</b></a>
  <span class="grow"></span>
  <a href="#/me" id="me-avatar" aria-label="Il tuo profilo"></a>
</header>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main class="content" id="app"></main>
</div>
<nav class="bottom" id="bottom"></nav>

<script src="fn-ws.js"></script>
<script src="fn-net.js"></script>
<script src="social.js"></script>
<script>
const { store, esc, timeAgo } = FNet;
const { toast, avatar, offlineNotice, drawComments, toggleVote } = Social;
const FEED = 'feed:post';
const SITE = 'w70-posts';
const MAX_IMAGES = 4;
const NAV = [['#/all', '🏠', 'Tutti'], ['#/following', '👥', 'Seguiti'], ['#/new', '✏️', 'Scrivi'], ['#/saved', '🔖', 'Salvati'], ['#/me', '👤', 'Profilo']];
const app = document.getElementById('app');
let items = [];
let channels = new Map();
const follows = () => store.get('post_follows', {});
const saved = () => store.get('post_saved', []);

async function refresh() {
  const [list, chans] = await Promise.all([FNet.readItems(FEED), FNet.readItems('feed:channels')]);
  items = list;
  channels = new Map(chans.map(c => [c.tag, c]));
  return list.online;
}

const { imageUrl } = Social;
function mediaHtml(n) {
  const media = Array.isArray(n.media) ? n.media : [];
  const video = media.find(m => m && m.type === 'video');
  const thumb = video && FNet.safeImage(video.thumb);
  const clip = video ? `<div class="media n1" data-media="${esc(n.id)}"><div class="play" onclick="playVideo('${esc(n.id)}',this)">${thumb ? `<img src="${thumb}" alt="">` : ''}<span>▶</span></div></div>` : '';
  const images = media.filter(m => m && m.type === 'image' && imageUrl(m)).slice(0, MAX_IMAGES);
  // Foto e video nello stesso post: prima le foto, poi il video.
  return (images.length ? `<div class="media n${images.length}" data-media="${esc(n.id)}">${images.map(m => `<img data-src="${esc(imageUrl(m))}" data-sha="${esc(m.sha || '')}" alt="">`).join('')}</div>` : '') + clip;
}

function noteHtml(n) {
  const quoted = n.repost ? items.find(x => x.id === n.repost) : null;
  const isSaved = saved().includes(n.id);
  return `<article class="note" data-note="${esc(n.id)}">
    <div class="note-head"><a href="#/user/${esc(n.tag)}" class="row grow">${avatar(n.name, channels.get(n.tag)?.avatar)}<span class="grow"><b style="overflow-wrap:anywhere">${esc(n.name)}</b><div class="sub">${esc(timeAgo(n.created))}${quoted ? ' · ha rilanciato' : ''}</div></span></a>
      <button class="round" onclick="noteMenu('${esc(n.id)}')" aria-label="Altro">⋯</button></div>
    ${n.text ? `<div class="note-text">${esc(n.text)}</div>` : ''}
    ${quoted ? `<a class="quote" href="#/p/${esc(quoted.id)}"><b>${esc(quoted.name)}</b><div style="overflow-wrap:anywhere">${esc(quoted.text || '')}</div></a>${mediaHtml(quoted)}` : mediaHtml(n)}
    <div class="note-actions">
      <button class="round" data-like="${esc(n.id)}" onclick="like(this)" aria-label="Mi piace">♡</button><span class="count" data-likes="${esc(n.id)}">0</span>
      <a class="round" href="#/p/${esc(n.id)}" aria-label="Commenti">💬</a><span class="count" data-comments-count="${esc(n.id)}">0</span>
      <button class="round" onclick="repost('${esc(n.id)}')" aria-label="Rilancia">🔁</button>
      <button class="round" onclick="share('${esc(n.id)}')" aria-label="Condividi">↗</button>
      <span class="grow"></span>
      <button class="round" onclick="toggleSave('${esc(n.id)}',this)" aria-label="Salva">${isSaved ? '🔖' : '📑'}</button>
    </div></article>`;
}

// Contatori dopo la pagina: ogni post ha la sua bacheca di attività.
async function fillCounts() {
  const me = await FNet.identity();
  for (const b of document.querySelectorAll('[data-like]')) {
    try {
      const a = FNet.foldActivity(await FNet.read('c:' + b.dataset.like));
      const liked = a.votes.get(me.pub) === 1;
      b.textContent = liked ? '❤️' : '♡';
      b.classList.toggle('on', liked);
      document.querySelector(`[data-likes="${b.dataset.like}"]`).textContent = a.likes;
      document.querySelector(`[data-comments-count="${b.dataset.like}"]`).textContent = a.comments.length;
    } catch {}
  }
}
async function like(button) {
  const r = await toggleVote(button.dataset.like);
  button.textContent = r.liked ? '❤️' : '♡';
  button.classList.toggle('on', r.liked);
  document.querySelector(`[data-likes="${button.dataset.like}"]`).textContent = r.likes;
}
// Doppio tocco sull'immagine: mette "mi piace", come su Instagram.
let lastTap = { id: null, t: 0 };
document.addEventListener('click', async e => {
  const box = e.target.closest('[data-media]');
  if (!box || e.target.closest('.play') || e.target.tagName === 'VIDEO') return;
  const id = box.dataset.media, now = Date.now();
  if (lastTap.id === id && now - lastTap.t < 350) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = '❤️';
    box.append(heart);
    setTimeout(() => heart.remove(), 800);
    const button = document.querySelector(`[data-like="${id}"]`);
    if (button && !button.classList.contains('on')) like(button);
  }
  lastTap = { id, t: now };
});

async function playVideo(id, el) {
  const n = items.find(x => x.id === id);
  const video = (n.media || []).find(m => m.type === 'video');
  el.querySelector('span').textContent = '…';
  try {
    const blob = await FNet.downloadVideo(video, (got, total) => { el.querySelector('span').textContent = total ? Math.round(got / total * 100) + '%' : '…'; });
    const v = document.createElement('video');
    v.controls = true;
    v.playsInline = true;
    v.src = URL.createObjectURL(blob);
    el.replaceWith(v);
    v.play().catch(() => {});
  } catch (e) { el.querySelector('span').textContent = '!'; toast(e.message); }
}

async function publishNote(data) {
  const id = FNet.newId('n');
  await FNet.publishMedia('post', FEED, id, { ...data, vis: 'public' }, { title: 'Post', text: data.text || '' });
}
async function repost(id) {
  try { await publishNote({ text: '', repost: id }); toast('Rilanciato'); render(); } catch (e) { toast(e.message); }
}
async function share(id) {
  const n = items.find(x => x.id === id);
  const text = `${n.name} su FreenetPosts: ${(n.text || '').slice(0, 80)} — codice ${n.id}`;
  try { await navigator.clipboard.writeText(text); toast('Copiato'); } catch { toast(text); }
}
function toggleSave(id, button) {
  const list = saved().filter(x => x !== id);
  const now = !saved().includes(id);
  if (now) list.unshift(id);
  store.set('post_saved', list);
  button.textContent = now ? '🔖' : '📑';
  toast(now ? 'Salvato' : 'Tolto dai salvati');
}
async function noteMenu(id) {
  const n = items.find(x => x.id === id);
  const me = await FNet.identity();
  if (n.author === me.pub) {
    const choice = prompt('Scrivi 1 per modificare il testo, 2 per eliminare il post');
    if (choice === '1') {
      const text = prompt('Nuovo testo', n.text || '');
      if (text === null) return;
      await FNet.saveItem(FEED, id, { text: text.trim().slice(0, 2000), media: n.media || [], repost: n.repost, vis: n.vis || 'public' });
      toast('Post modificato');
      render();
    }
    if (choice !== '2' || !confirm('Eliminare questo post?')) return;
    await FNet.deleteItem(FEED, id);
    try {
      for (const m of n.media || []) if (m.type === 'video') await FNet.wipeVideoParts(m.parts || []);
      const photos = (n.media || []).filter(m => m.type === 'image');
      for (const m of photos) await FNet.call('siteDeleteFile', { site: SITE, file: m.file });
      if (photos.length) await FNet.publishSite(SITE);
      await FNet.removeFromChannel(id);
    } catch {}
    toast('Post eliminato');
    render();
    return;
  }
  const choice = prompt('Scrivi 1 per segnalare il post, 2 per bloccare questo utente');
  if (choice === '1') { await FNet.reportItem(FEED, id); toast('Segnalazione inviata'); }
  if (choice === '2') { FNet.blockUser(n.tag, n.name); toast('Utente bloccato'); render(); }
}

function showPicked(input) {
  const box = document.getElementById('picked');
  const files = [...input.files];
  box.innerHTML = files.map(f => f.type.startsWith('image/') ? `<img src="${URL.createObjectURL(f)}" alt="">` : `<span class="chip">🎬 ${esc(f.name)}</span>`).join('');
}
async function sendNote(form) {
  const text = form.text.value.trim();
  const files = [...form.media.files];
  if (!text && !files.length) return;
  const button = form.querySelector('button[type=submit]');
  const state = document.getElementById('compose-state');
  button.disabled = true;
  try {
    const id = FNet.newId('n');
    const media = files.length ? await Social.uploadMedia(files, id, SITE, t => { state.textContent = t; }, MAX_IMAGES) : [];
    state.textContent = 'Pubblico il post';
    await FNet.publishMedia('post', FEED, id, { text, media, vis: 'public' }, { title: 'Post', text, media: media.map(m => m.type) });
    form.reset();
    document.getElementById('picked').innerHTML = '';
    state.textContent = '';
    toast('Post pubblicato');
    render();
  } catch (e) { state.textContent = 'Non pubblicato: ' + e.message; }
  button.disabled = false;
}
const composeBox = `<form class="panel compose" onsubmit="event.preventDefault();sendNote(this)">
  <textarea name="text" maxlength="2000" placeholder="Che cosa hai imparato oggi?" aria-label="Nuovo post"></textarea>
  <div class="preview" id="picked"></div>
  <div class="row"><label class="btn attach">📷 Foto o video<input type="file" name="media" accept="image/*,video/*" multiple hidden onclick="if(FNet.IN_APP){event.preventDefault();location.hash='#/new'}" onchange="showPicked(this)"></label>
  <span class="grow sub" id="compose-state"></span><button class="btn main" type="submit">Pubblica</button></div></form>`;

function listHtml(list, empty) {
  return list.length ? list.map(noteHtml).join('') : empty;
}
async function viewAll() {
  const online = await refresh();
  const list = items.filter(FNet.isVisible);
  app.innerHTML = `<div class="column">${offlineNotice(online)}${composeBox}${listHtml(list, '<div class="empty"><div>🕊️</div><h2>Ancora nessun post</h2><p>Scrivi il primo, con foto o video.</p></div>')}</div>`;
  fillCounts();
}
async function viewFollowing() {
  const online = await refresh();
  const mine = follows();
  const list = items.filter(FNet.isVisible).filter(n => mine[n.tag]);
  app.innerHTML = `<div class="column">${offlineNotice(online)}<h2 style="margin-bottom:12px">Seguiti</h2>${listHtml(list, '<div class="empty"><div>👥</div><h2>Non segui ancora nessuno</h2><p>Apri un profilo e premi Segui.</p></div>')}</div>`;
  fillCounts();
}
async function viewSaved() {
  await refresh();
  const byId = new Map(items.map(n => [n.id, n]));
  const list = saved().map(id => byId.get(id)).filter(Boolean);
  app.innerHTML = `<div class="column"><h2 style="margin-bottom:12px">Salvati</h2>${listHtml(list, '<div class="empty"><div>🔖</div><h2>Niente di salvato</h2><p>Tocca 📑 su un post per ritrovarlo qui.</p></div>')}</div>`;
  fillCounts();
}
async function viewUser(param) {
  await refresh();
  const me = await FNet.identity();
  const tag = param || me.tag;
  const own = tag === me.tag;
  const list = items.filter(n => n.tag === tag && (own || FNet.isVisible(n)));
  const name = own ? await FNet.displayName() : list[0]?.name || channels.get(tag)?.name || 'Profilo';
  const info = channels.get(tag) || {};
  const followed = !!follows()[tag];
  app.innerHTML = `<div class="column"><div class="row" style="margin-bottom:12px">${avatar(name, own ? FNet.profile().avatar : info.avatar, true)}<div class="grow"><h1 style="font-size:20px;overflow-wrap:anywhere">${esc(name)}</h1><div class="sub">${list.length} post</div></div></div>
    <p style="white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px">${esc(own ? FNet.profile().bio : info.bio || '')}</p>
    <div class="row wrap" style="margin-bottom:14px">${own ? '<a class="btn" href="video.html#/settings">Modifica profilo</a>' : `<button class="btn ${followed ? '' : 'main'}" onclick="toggleFollow('${esc(tag)}')">${followed ? 'Segui già' : 'Segui'}</button>`}</div>
    ${list.map(noteHtml).join('')}</div>`;
  fillCounts();
}
function toggleFollow(tag) {
  const f = follows();
  if (f[tag]) delete f[tag]; else f[tag] = true;
  store.set('post_follows', f);
  render();
}
async function viewNote(id) {
  await refresh();
  const n = items.find(x => x.id === id);
  if (!n) { app.innerHTML = '<div class="empty"><div>🔎</div><h2>Post non trovato</h2></div>'; return; }
  app.innerHTML = `<div class="column">${noteHtml(n)}<div class="panel" data-comments id="comments"></div></div>`;
  fillCounts();
  drawComments(document.getElementById('comments'), id);
}
async function drawChrome() {
  document.getElementById('me-avatar').innerHTML = avatar(await FNet.displayName(), FNet.profile().avatar);
  const route = location.hash || '#/all';
  const entry = ([hash, icon, label]) => `<a class="nav-item ${route.startsWith(hash) ? 'on' : ''}" href="${hash}"><span>${icon}</span><span>${label}</span></a>`;
  document.getElementById('side').innerHTML = NAV.map(entry).join('');
  document.getElementById('bottom').innerHTML = NAV.map(entry).join('');
}
async function render() {
  const [, page, arg] = (location.hash || '#/all').match(/^#\/([a-z]+)\/?(.*)$/) || [null, 'all', ''];
  const param = arg ? decodeURIComponent(arg) : '';
  drawChrome();
  try {
    if (page === 'following') await viewFollowing();
    else if (page === 'saved') await viewSaved();
    else if (page === 'me') await viewUser('');
    else if (page === 'user') await viewUser(param);
    else if (page === 'p') await viewNote(param);
    else if (page === 'new') app.innerHTML = `<div class="column"><h2 style="margin-bottom:12px">Nuovo post</h2>${composeBox}</div>`;
    else await viewAll();
    FNet.loadVerifiedImages(app);
  } catch (e) {
    app.innerHTML = `<div class="empty"><div>⚠️</div><h2>Qualcosa non ha funzionato</h2><p>${esc(e.message)}</p></div>`;
  }
}
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
