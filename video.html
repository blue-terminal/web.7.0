<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreenetTV — Web 7.0</title>
<link rel="stylesheet" href="web7.css">
<style>
.player { background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; position: relative; color: #fff; text-align: center; padding: 0; }
.player video { width: 100%; height: 100%; }
.watch { display: grid; gap: 18px; }
@media (min-width: 1100px) { .watch { grid-template-columns: minmax(0, 1fr) 360px; } }
.watch h1 { font-size: 19px; margin: 12px 0 8px; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
.actions .btn { flex-shrink: 0; }
.descr { background: var(--panel2); border-radius: 12px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 16px; }
.comment { display: flex; gap: 10px; padding: 10px 0; min-width: 0; }
.comment p { white-space: pre-wrap; overflow-wrap: anywhere; }
.mini { display: flex; gap: 10px; padding: 6px 0; cursor: pointer; min-width: 0; }
.mini .thumb { width: 150px; flex-shrink: 0; border-radius: 10px; font-size: 22px; }
.banner { height: 96px; border-radius: var(--radius); background: linear-gradient(120deg, #f5b301, #38c7b4 70%); }
.ch-head { display: flex; gap: 14px; align-items: center; padding: 14px 0; min-width: 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
.tab { padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; flex-shrink: 0; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.vrow { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: flex-start; min-width: 0; }
.vrow .thumb { width: 112px; flex-shrink: 0; border-radius: 10px; font-size: 20px; }
.menu { position: fixed; right: 8px; top: calc(var(--top-h) + 2px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; z-index: 30; min-width: 190px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.menu button { display: block; width: 100%; text-align: left; padding: 12px 16px; }
.menu button:hover { background: var(--panel2); }
.livebox video { background: #000; border-radius: var(--radius); width: 100%; aspect-ratio: 16/9; margin-bottom: 12px; }
</style>
</head>
<body>
<header class="top">
  <button class="round only-wide" onclick="document.body.classList.toggle('wide-nav')" title="Menu" aria-label="Menu">☰</button>
  <a class="round" href="index.html" title="Torna a Web 7.0" aria-label="Torna a Web 7.0" id="back-home">‹</a>
  <a class="brand" href="#/home">◈ Freenet<b>TV</b></a>
  <form class="search" onsubmit="event.preventDefault();location.hash='#/home/'+encodeURIComponent(this.q.value.trim())">
    <input name="q" type="search" placeholder="Cerca" aria-label="Cerca" autocomplete="off">
  </form>
  <button class="crea" onclick="toggleMenu()" title="Crea" aria-label="Crea">＋ <span class="only-wide">Crea</span></button>
  <a class="round only-wide" href="#/studio/comments" title="Notifiche: commenti ai tuoi video" aria-label="Notifiche">🔔</a>
  <a href="#/channel/me" id="me-avatar" aria-label="Il tuo canale"></a>
</header>
<div class="menu" id="menu" hidden>
  <button onclick="go('#/upload')">⬆️ Carica un video</button>
  <button onclick="go('#/live')">🔴 Vai in diretta</button>
</div>

<div class="shell">
  <nav class="side" id="side"></nav>
  <main class="content" id="app"></main>
</div>
<nav class="bottom" id="bottom"></nav>

<script src="fn-net.js"></script>
<script>
const { store, esc, timeAgo, CATEGORIES } = FNet;
const FEED = 'feed:video';
const app = document.getElementById('app');
const NAV = [
  ['#/home', '🏠', 'Home'], ['#/subs', '📚', 'Iscrizioni'], ['#/live', '🔴', 'Live'],
  ['#/library', '🕘', 'Libreria'], ['#/studio', '🎛️', 'Studio'], ['#/settings', '⚙️', 'Impostazioni'],
];
const PHONE_NAV = ['#/home', '#/subs', '#/live', '#/studio', '#/settings'];
let items = [];
let channels = new Map();
let me = null;
let watchUrl = null;
let current = null;
let renderSeq = 0;

function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}
function go(hash) { document.getElementById('menu').hidden = true; location.hash = hash; }
function toggleMenu() { const m = document.getElementById('menu'); m.hidden = !m.hidden; }

function avatarHtml(name, image, big) {
  const safe = FNet.safeImage(image);
  const cls = 'avatar' + (big ? ' big' : '');
  return safe ? `<img class="${cls}" src="${safe}" alt="">` : `<span class="${cls}">${esc(String(name || '?')[0].toUpperCase())}</span>`;
}
const viewsText = n => (n === 1 ? '1 visualizzazione' : `${n} visualizzazioni`);
function duration(s) {
  if (!s) return '';
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
}
function thumbHtml(v) {
  const img = FNet.safeImage(v.thumb);
  const badge = v.live ? '<span class="badge live">LIVE</span>' : v.dur ? `<span class="badge">${esc(duration(v.dur))}</span>` : '';
  return `<div class="thumb">${img ? `<img src="${img}" alt="" loading="lazy">` : '🎓'}${badge}</div>`;
}
function card(v) {
  return `<a class="card" href="#/watch/${esc(v.id)}">${thumbHtml(v)}
    <div class="meta">${avatarHtml(v.name, channels.get(v.tag)?.avatar)}<div class="grow"><h3>${esc(v.title)}</h3>
    <div class="sub">${esc(v.name)}</div>
    <div class="sub"><span data-views="${esc(v.id)}"></span>${esc(timeAgo(v.created))}${v.cat ? ' · ' + esc(v.cat) : ''}</div></div></div></a>`;
}
function emptyBox(icon, title, text, action) {
  return `<div class="empty"><div>${icon}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${action || ''}</div>`;
}
const uploadBtn = '<a class="btn main" href="#/upload">⬆️ Carica un video</a>';

async function refresh() {
  const [videos, chans] = await Promise.all([FNet.readItems(FEED), FNet.readItems('feed:channels')]);
  items = videos;
  channels = new Map(chans.map(c => [c.tag, c]));
  return videos.online;
}
function offlineNotice(online) {
  if (online) return '';
  return FNet.hasBridge()
    ? '<div class="notice">Il nodo non risponde: stai vedendo gli ultimi dati salvati.</div>'
    : "<div class=\"notice\">Da questo browser non si può accedere alla rete condivisa: apri FreenetTV nell'app Freenet.</div>";
}

// Le visualizzazioni stanno in un contratto per ogni video: si leggono una alla volta, dopo la pagina.
async function fillViews(seq) {
  for (const el of document.querySelectorAll('[data-views]')) {
    if (seq !== renderSeq) return;
    try {
      const a = FNet.foldActivity(await FNet.read('c:' + el.dataset.views));
      if (seq === renderSeq) el.textContent = `${viewsText(a.views)} · `;
    } catch {}
  }
}

// ── home ───────────────────────────────────────────────────────────────────
let currentCategory = 'Tutti';
function setCategory(index) { currentCategory = ['Tutti', 'Live', ...CATEGORIES][index]; render(); }
async function viewHome(query, seq) {
  const online = await refresh();
  const q = (query || '').toLowerCase();
  const list = items.filter(FNet.isVisible)
    .filter(v => currentCategory === 'Tutti' || v.cat === currentCategory || (currentCategory === 'Live' && v.live))
    .filter(v => !q || v.id === query || `${v.title} ${v.desc} ${v.name} ${v.cat}`.toLowerCase().includes(q));
  const chips = ['Tutti', 'Live', ...CATEGORIES].map((c, i) => `<button class="chip ${c === currentCategory ? 'on' : ''}" onclick="setCategory(${i})">${c === 'Live' ? '🔴 In diretta' : c}</button>`).join('');
  app.innerHTML = `${offlineNotice(online)}<div class="chips">${chips}</div>` + (list.length
    ? `<div class="grid">${list.map(card).join('')}</div>`
    : emptyBox('🎓', q ? 'Nessun risultato' : 'Nessun video qui', 'Solo video che insegnano qualcosa: scienza, tecnica, storia, lingue e altro.', uploadBtn));
  fillViews(seq);
}

// ── iscrizioni e libreria ──────────────────────────────────────────────────
const subs = () => store.get('tv_subs', {});
async function viewSubs(seq) {
  const online = await refresh();
  const mine = subs();
  const list = items.filter(FNet.isVisible).filter(v => mine[v.tag]);
  app.innerHTML = offlineNotice(online) + '<h2 style="margin-bottom:12px">Iscrizioni</h2>' + (list.length
    ? `<div class="grid">${list.map(card).join('')}</div>`
    : emptyBox('📚', 'Ancora nessuna iscrizione', 'Apri un canale e premi Iscriviti: i suoi video arrivano qui.'));
  fillViews(seq);
}
async function viewLibrary() {
  await refresh();
  const byId = new Map(items.map(v => [v.id, v]));
  const section = (title, ids, empty) => {
    const list = ids.map(id => byId.get(id)).filter(Boolean);
    return `<h2 style="margin:16px 0 10px">${title}</h2>` + (list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<p class="sub">${empty}</p>`);
  };
  app.innerHTML = section('Cronologia', store.get('tv_history', []), 'Nessun video guardato.')
    + section('Da guardare dopo', store.get('tv_later', []), 'Premi Salva su un video per trovarlo qui.')
    + section('Video che ti piacciono', store.get('tv_liked', []), 'Nessun video.');
}

// ── pagina video ───────────────────────────────────────────────────────────
async function viewWatch(id) {
  await refresh();
  const v = items.find(x => x.id === id);
  if (!v) { app.innerHTML = emptyBox('🔎', 'Video non trovato', 'Potrebbe essere stato eliminato dal suo autore.'); return; }
  current = v;
  const subscribed = !!subs()[v.tag];
  const saved = store.get('tv_later', []).includes(v.id);
  const next = items.filter(FNet.isVisible).filter(x => x.id !== v.id).slice(0, 12);
  const speed = store.get('tv_speed', 1);
  app.innerHTML = `<div class="watch"><div class="grow" style="min-width:0">
    <div class="player" id="player"><div id="player-state">Recupero il video dalla rete…</div></div>
    <h1>${esc(v.title)}</h1>
    <div class="row"><a href="#/channel/${esc(v.tag)}" class="row grow">${avatarHtml(v.name, channels.get(v.tag)?.avatar)}<span class="grow"><b style="overflow-wrap:anywhere">${esc(v.name)}</b><div class="sub" id="ch-subs"></div></span></a>
      <button class="btn ${subscribed ? '' : 'main'}" id="sub-btn" onclick="toggleSub('${esc(v.tag)}')">${subscribed ? 'Iscritto' : 'Iscriviti'}</button></div>
    <div class="actions">
      <button class="btn" id="like" onclick="vote(1)">👍 <span>0</span></button>
      <button class="btn" id="dislike" onclick="vote(-1)">👎 <span>0</span></button>
      <button class="btn" onclick="enterFullscreen()">⛶ Schermo intero</button>
      <select class="btn" aria-label="Velocità" onchange="setSpeed(this.value)">${[0.75, 1, 1.25, 1.5, 2].map(s => `<option value="${s}" ${s === speed ? 'selected' : ''}>${s}×</option>`).join('')}</select>
      <button class="btn" onclick="toggleLater()">${saved ? '✓ Salvato' : '🔖 Salva'}</button>
      <button class="btn" onclick="shareVideo()">🔗 Condividi</button>
      <button class="btn" onclick="reportVideo()">🚩 Segnala</button>
      <button class="btn" onclick="blockAuthor()">🚫 Blocca canale</button>
    </div>
    <div class="descr"><div class="sub" id="views-line">${esc(v.cat || '')} · ${esc(timeAgo(v.created))}</div>${esc(v.desc || '')}</div>
    <h2 style="font-size:16px;margin-bottom:8px"><span id="comment-count">0</span> commenti</h2>
    <form class="row" onsubmit="event.preventDefault();sendComment(this)"><input class="grow" name="text" maxlength="2000" placeholder="Aggiungi un commento" style="padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);min-width:0" required><button class="btn main">Invia</button></form>
    <div id="comments"></div>
  </div><aside style="min-width:0">${next.map(n => `<a class="mini" href="#/watch/${esc(n.id)}">${thumbHtml(n)}<span class="grow"><b style="display:block;overflow-wrap:anywhere">${esc(n.title)}</b><span class="sub">${esc(n.name)}</span></span></a>`).join('')}</aside></div>`;
  loadActivity();
  loadChannelStats(v.tag);
  if (store.get('tv_history_on', true)) {
    const h = store.get('tv_history', []).filter(x => x !== v.id);
    h.unshift(v.id);
    store.set('tv_history', h.slice(0, 200));
  }
  if (v.live) playLive(v); else playVideo(v);
  markViewed(v.id);
}

async function playVideo(v) {
  const state = document.getElementById('player-state');
  try {
    const blob = await FNet.downloadVideo(v, (got, total) => {
      if (state) state.textContent = total ? `Recupero dalla rete: ${Math.round(got / total * 100)}%` : `Recupero dalla rete: ${Math.round(got / 1048576)} MB`;
    });
    if (current !== v) return;
    if (watchUrl) URL.revokeObjectURL(watchUrl);
    watchUrl = URL.createObjectURL(blob);
    document.getElementById('player').innerHTML = `<video id="vid" controls playsinline src="${watchUrl}"></video>`;
    const el = document.getElementById('vid');
    el.playbackRate = store.get('tv_speed', 1);
    if (store.get('tv_autoplay', true)) el.play().catch(() => {});
  } catch (e) {
    if (state) state.textContent = e.message;
  }
}
function enterFullscreen() {
  const el = document.getElementById('vid');
  if (!el) { toast('Il video non è ancora pronto'); return; }
  const request = el.requestFullscreen || el.webkitRequestFullscreen;
  if (request) Promise.resolve(request.call(el)).catch(() => toast('Schermo intero non disponibile'));
  else if (el.webkitEnterFullscreen) el.webkitEnterFullscreen();
}
function setSpeed(value) {
  store.set('tv_speed', Number(value));
  const el = document.getElementById('vid');
  if (el) el.playbackRate = Number(value);
}
function toggleLater() {
  const list = store.get('tv_later', []);
  const i = list.indexOf(current.id);
  if (i >= 0) list.splice(i, 1); else list.unshift(current.id);
  store.set('tv_later', list);
  render();
}
async function shareVideo() {
  const text = `${current.title} — su FreenetTV, codice ${current.id}`;
  try { await navigator.clipboard.writeText(text); toast('Copiato: incollalo a chi vuoi'); } catch { toast(text); }
}
async function reportVideo() {
  if (!confirm('Segnalare questo video come non educativo o non adatto? Con 3 segnalazioni sparisce dalle liste.')) return;
  const r = await FNet.reportItem(FEED, current.id);
  toast(r.queued ? 'Salvato: partirà quando il nodo risponde' : 'Segnalazione inviata');
}
function blockAuthor() {
  if (!confirm(`Bloccare ${current.name}? Non vedrai più i suoi video e commenti. Puoi annullare dalle Impostazioni.`)) return;
  FNet.blockUser(current.tag, current.name);
  toast('Canale bloccato');
  location.hash = '#/home';
}
function toggleSub(tag) {
  const s = subs();
  if (s[tag]) delete s[tag]; else { s[tag] = true; FNet.post('ch:' + tag, 'sub', {}); }
  store.set('tv_subs', s);
  const b = document.getElementById('sub-btn');
  if (b) { b.textContent = s[tag] ? 'Iscritto' : 'Iscriviti'; b.className = 'btn' + (s[tag] ? '' : ' main'); }
}
async function loadChannelStats(tag) {
  const msgs = await FNet.read('ch:' + tag);
  const n = new Set(msgs.filter(m => m.k === 'sub').map(m => m.author)).size;
  const el = document.getElementById('ch-subs');
  if (el) el.textContent = n === 1 ? '1 iscritto' : `${n} iscritti`;
}
async function loadActivity() {
  const v = current;
  const a = FNet.foldActivity(await FNet.read('c:' + v.id));
  if (current !== v) return;
  me = me || await FNet.identity();
  const mine = a.votes.get(me.pub);
  const like = document.getElementById('like'), dislike = document.getElementById('dislike');
  if (!like) return;
  like.querySelector('span').textContent = a.likes;
  dislike.querySelector('span').textContent = a.dislikes;
  like.classList.toggle('on', mine === 1);
  dislike.classList.toggle('on', mine === -1);
  document.getElementById('comment-count').textContent = a.comments.length;
  document.getElementById('views-line').textContent = `${viewsText(a.views)} · ${v.cat || ''} · ${timeAgo(v.created)}`;
  document.getElementById('comments').innerHTML = a.comments.map(c => `<div class="comment">${avatarHtml(c.name)}<div class="grow">
    <div class="sub"><b>${esc(c.name)}</b> · ${esc(timeAgo(c.time))} ${c.author === me.pub ? `· <button class="sub" onclick="deleteComment('${esc(c.id)}')">Elimina</button>` : ''}</div><p>${esc(c.text)}</p></div></div>`).join('');
}
async function markViewed(id) {
  const seen = store.get('tv_viewed', {});
  if (seen[id]) return;
  seen[id] = 1;
  store.set('tv_viewed', seen);
  await FNet.post('c:' + id, 'view', {});
}
async function vote(value) {
  me = me || await FNet.identity();
  const a = FNet.foldActivity(await FNet.read('c:' + current.id));
  const next = a.votes.get(me.pub) === value ? 0 : value;
  const liked = store.get('tv_liked', []).filter(x => x !== current.id);
  if (next === 1) liked.unshift(current.id);
  store.set('tv_liked', liked);
  await FNet.post('c:' + current.id, 'vote', { value: next });
  loadActivity();
}
async function sendComment(form) {
  const text = form.text.value.trim();
  if (!text) return;
  form.text.value = '';
  const r = await FNet.post('c:' + current.id, 'comment', { text });
  if (r.queued) toast('Salvato: partirà quando il nodo risponde');
  loadActivity();
}
async function deleteComment(ref) {
  await FNet.post('c:' + current.id, 'comment-del', { ref });
  loadActivity();
}

// ── canale ─────────────────────────────────────────────────────────────────
let channelTab = 'video';
function setChannelTab(tab) { channelTab = tab; render(); }
async function viewChannel(tagParam, seq) {
  await refresh();
  me = await FNet.identity();
  const tag = tagParam === 'me' ? me.tag : tagParam;
  const own = tag === me.tag;
  const list = items.filter(v => v.tag === tag && (own || FNet.isVisible(v)));
  const info = channels.get(tag) || {};
  const name = own ? await FNet.displayName() : list[0]?.name || info.name || 'Canale';
  const image = own ? FNet.profile().avatar : info.avatar;
  const bio = own ? FNet.profile().bio : info.bio;
  const subscribed = !!subs()[tag];
  app.innerHTML = `<div class="banner"></div><div class="ch-head">${avatarHtml(name, image, true)}
    <div class="grow"><h1 style="font-size:21px;overflow-wrap:anywhere">${esc(name)}</h1><div class="sub"><span id="ch-subs"></span> · ${list.length} video</div></div></div>
    <div class="row wrap" style="margin-bottom:14px">${own
      ? '<a class="btn" href="#/settings">Personalizza canale</a><a class="btn" href="#/studio">Gestisci video</a>'
      : `<button class="btn ${subscribed ? '' : 'main'}" id="sub-btn" onclick="toggleSub('${esc(tag)}')">${subscribed ? 'Iscritto' : 'Iscriviti'}</button>`}</div>
    <div class="tabs"><button class="tab ${channelTab === 'video' ? 'on' : ''}" onclick="setChannelTab('video')">Video</button><button class="tab ${channelTab === 'info' ? 'on' : ''}" onclick="setChannelTab('info')">Informazioni</button></div>`
    + (channelTab === 'info'
      ? `<div class="panel"><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(bio || 'Nessuna descrizione.')}</p></div>`
      : list.length ? `<div class="grid">${list.map(card).join('')}</div>` : emptyBox('🎬', 'Nessun video', own ? 'Carica il tuo primo video educativo.' : 'Questo canale non ha ancora video.', own ? uploadBtn : ''));
  loadChannelStats(tag);
  fillViews(seq);
}

// ── caricamento ────────────────────────────────────────────────────────────
function categorySelect(value) {
  return `<select name="cat" required><option value="">Scegli…</option>${CATEGORIES.map(c => `<option ${c === value ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
}
function visibilitySelect(value) {
  return `<select name="vis"><option value="public" ${value !== 'unlisted' ? 'selected' : ''}>Pubblico</option><option value="unlisted" ${value === 'unlisted' ? 'selected' : ''}>Non in elenco</option></select>`;
}
function legacyVideos() {
  try { return JSON.parse(localStorage.getItem('fn_my_videos') || '[]'); } catch { return []; }
}
function viewUpload() {
  const oldOnes = legacyVideos().filter(o => !store.get('tv_migrated', {})[o.id]);
  app.innerHTML = `<div class="panel" style="max-width:640px;margin:auto"><h2>Carica un video</h2>
    <form id="up" onsubmit="event.preventDefault();doUpload(this)">
      <label class="field"><span>File video (massimo ${Math.floor(FNet.MAX_PARTS * FNet.PART_BYTES / 1048576)} MB)</span><input type="file" name="file" accept="video/*" required></label>
      <label class="field"><span>Titolo</span><input name="title" maxlength="120" required></label>
      <label class="field"><span>Descrizione</span><textarea name="desc" maxlength="3000"></textarea></label>
      <label class="field"><span>Categoria educativa</span>${categorySelect('')}</label>
      <label class="field"><span>Visibilità</span>${visibilitySelect('public')}</label>
      <button class="btn main" style="width:100%">Pubblica sulla rete Freenet</button>
    </form><div id="up-progress" hidden style="margin-top:14px"><div class="sub" id="up-label" style="margin-bottom:6px"></div><div class="bar"><i id="up-bar"></i></div></div></div>
    ${oldOnes.length ? `<div class="panel" style="max-width:640px;margin:14px auto"><h2>Salvati solo sul telefono</h2><p class="sub" style="margin-bottom:10px">Questi video non sono mai usciti dal dispositivo. Premi Prepara, scegli la categoria e pubblica.</p>${oldOnes.map(o => `<div class="vrow"><span class="grow" style="overflow-wrap:anywhere">${esc(o.title)}</span><button class="btn" onclick="prepareLegacy('${esc(String(o.id))}')">Prepara</button></div>`).join('')}</div>` : ''}`;
}
function legacyBlob(key) {
  return new Promise((res, rej) => {
    const open = indexedDB.open('FreenetTV', 1);
    open.onupgradeneeded = e => e.target.result.createObjectStore('blobs');
    open.onerror = () => rej(new Error('Archivio non disponibile'));
    open.onsuccess = () => {
      const get = open.result.transaction('blobs').objectStore('blobs').get(key);
      get.onsuccess = () => (get.result ? res(get.result) : rej(new Error('File non trovato sul telefono')));
      get.onerror = () => rej(new Error('Archivio non disponibile'));
    };
  });
}
let legacyInProgress = null;
async function prepareLegacy(id) {
  const old = legacyVideos().find(o => String(o.id) === id);
  if (!old) return;
  try {
    const data = await legacyBlob(old.key);
    const form = document.getElementById('up');
    form.title.value = old.title;
    const transfer = new DataTransfer();
    transfer.items.add(new File([data], 'video', { type: old.mime || 'video/mp4' }));
    form.file.files = transfer.files;
    legacyInProgress = id;
    toast('Scegli la categoria e premi Pubblica');
  } catch (e) { toast(e.message); }
}
const videoFacts = FNet.videoFacts;
async function doUpload(form) {
  const file = form.file.files[0];
  if (!file) return;
  const progress = document.getElementById('up-progress');
  const label = document.getElementById('up-label');
  const bar = document.getElementById('up-bar');
  const data = { title: form.title.value.trim(), desc: form.desc.value.trim(), cat: form.cat.value, vis: form.vis.value };
  const button = form.querySelector('button');
  button.disabled = true;
  progress.hidden = false;
  try {
    const step = (text, ratio) => { label.textContent = text; bar.style.width = Math.round(ratio * 90) + '%'; };
    step('Analizzo il video', 0);
    const facts = await videoFacts(file);
    const id = FNet.newId('v');
    const parts = await FNet.uploadVideoParts(file, id, step);
    step('Aggiorno il tuo canale', 1);
    await FNet.publishMedia('video', FEED, id, { ...data, ...facts, parts, mime: file.type, size: file.size },
      { title: data.title, desc: data.desc, cat: data.cat, parts: parts.map(p => p.key) });
    bar.style.width = '100%';
    if (legacyInProgress) {
      const done = store.get('tv_migrated', {});
      done[legacyInProgress] = 1;
      store.set('tv_migrated', done);
      legacyInProgress = null;
    }
    toast('Video pubblicato sulla rete Freenet');
    location.hash = '#/studio/content';
  } catch (e) {
    label.textContent = 'Pubblicazione non riuscita: ' + e.message;
    button.disabled = false;
  }
}

// ── studio ─────────────────────────────────────────────────────────────────
async function viewStudio(tab) {
  const studioTab = ['dashboard', 'content', 'comments'].includes(tab) ? tab : 'dashboard';
  await refresh();
  me = await FNet.identity();
  const mine = items.filter(v => v.tag === me.tag);
  const tabs = [['dashboard', 'Panoramica'], ['content', 'Contenuti'], ['comments', 'Commenti']];
  app.innerHTML = `<h1 style="font-size:21px;margin-bottom:10px">Studio</h1>
    <div class="tabs">${tabs.map(([k, l]) => `<a class="tab ${k === studioTab ? 'on' : ''}" href="#/studio/${k}">${l}</a>`).join('')}<a class="tab" href="#/settings">Personalizza</a></div><div id="studio-body"><p class="sub">Leggo i dati dalla rete…</p></div>`;
  const activity = new Map();
  await Promise.all(mine.map(async v => activity.set(v.id, FNet.foldActivity(await FNet.read('c:' + v.id)))));
  const body = document.getElementById('studio-body');
  if (!body) return;
  if (!mine.length) { body.innerHTML = emptyBox('🎬', 'Nessun video', 'I video che pubblichi compaiono qui.', uploadBtn); return; }
  const sum = key => mine.reduce((t, v) => t + activity.get(v.id)[key], 0);
  if (studioTab === 'dashboard') {
    const subsMsgs = await FNet.read('ch:' + me.tag);
    const subCount = new Set(subsMsgs.filter(m => m.k === 'sub').map(m => m.author)).size;
    const totalComments = mine.reduce((t, v) => t + activity.get(v.id).comments.length, 0);
    const top = [...mine].sort((a, b) => activity.get(b.id).views - activity.get(a.id).views)[0];
    body.innerHTML = `<div class="stats">
      <div class="stat"><b>${subCount}</b><span class="sub">Iscritti</span></div>
      <div class="stat"><b>${mine.length}</b><span class="sub">Video</span></div>
      <div class="stat"><b>${sum('views')}</b><span class="sub">Visualizzazioni</span></div>
      <div class="stat"><b>${sum('likes')}</b><span class="sub">Mi piace</span></div>
      <div class="stat"><b>${totalComments}</b><span class="sub">Commenti</span></div></div>
      <div class="panel"><h2>Il più visto</h2><a class="vrow" style="border:0;padding:0" href="#/watch/${esc(top.id)}">${thumbHtml(top)}<span class="grow"><b style="overflow-wrap:anywhere">${esc(top.title)}</b><div class="sub">${viewsText(activity.get(top.id).views)}</div></span></a></div>`;
  } else if (studioTab === 'content') {
    body.innerHTML = mine.map(v => {
      const a = activity.get(v.id);
      return `<div class="vrow">${thumbHtml(v)}<div class="grow"><b style="overflow-wrap:anywhere">${esc(v.title)}</b>
        <div class="sub">${v.vis === 'unlisted' ? 'Non in elenco' : 'Pubblico'} · ${esc(v.cat || '')} · ${esc(timeAgo(v.created))}</div>
        <div class="sub">${a.views} viste · ${a.likes} 👍 · ${a.dislikes} 👎 · ${a.comments.length} commenti${v.reports ? ` · ${v.reports} segnalazioni` : ''}</div>
        <div class="row wrap" style="margin-top:8px"><a class="btn" href="#/edit/${esc(v.id)}">Modifica</a><a class="btn" href="#/watch/${esc(v.id)}">Guarda</a><button class="btn danger" onclick="removeVideo('${esc(v.id)}')">Elimina</button></div></div></div>`;
    }).join('');
  } else {
    const rows = mine.flatMap(v => activity.get(v.id).comments.map(c => ({ c, v }))).sort((a, b) => b.c.time - a.c.time);
    body.innerHTML = rows.length ? rows.map(({ c, v }) => `<div class="comment">${avatarHtml(c.name)}<div class="grow"><div class="sub"><b>${esc(c.name)}</b> · ${esc(timeAgo(c.time))} · su <a href="#/watch/${esc(v.id)}">${esc(v.title)}</a></div><p>${esc(c.text)}</p></div></div>`).join('') : emptyBox('💬', 'Nessun commento', 'I commenti ai tuoi video compaiono qui.');
  }
}
async function removeVideo(id) {
  if (!confirm('Eliminare questo video? Il contenuto viene cancellato dai contratti e il video sparisce dalle liste.')) return;
  const v = items.find(x => x.id === id);
  toast('Sto eliminando il video…');
  try {
    await FNet.deleteItem(FEED, id);
    await FNet.wipeVideoParts(v.parts || []);
    await FNet.removeFromChannel(id);
    toast('Video eliminato');
  } catch (e) { toast('Eliminazione parziale: ' + e.message); }
  render();
}
async function viewEdit(id) {
  await refresh();
  me = await FNet.identity();
  const v = items.find(x => x.id === id && x.tag === me.tag);
  if (!v) { app.innerHTML = emptyBox('🔒', 'Non puoi modificare questo video', 'Solo chi lo ha pubblicato può farlo.'); return; }
  app.innerHTML = `<div class="panel" style="max-width:640px;margin:auto"><h2>Modifica video</h2>${thumbHtml(v)}
    <form style="margin-top:14px" onsubmit="event.preventDefault();saveEdit('${esc(id)}',this)">
      <label class="field"><span>Titolo</span><input name="title" maxlength="120" required value="${esc(v.title)}"></label>

async function saveEdit(id, form) {
  const v = items.find(x => x.id === id);
  const data = { title: form.title.value.trim(), desc: form.desc.value.trim(), cat: form.cat.value, vis: form.vis.value };
  const keep = { thumb: v.thumb, dur: v.dur, parts: v.parts, mime: v.mime, size: v.size, live: v.live, ch: v.ch };
  if (form.thumb.files[0]) keep.thumb = await FNet.smallImage(form.thumb.files[0], 256, 0.4);
  try {
    await FNet.publishMedia('video', FEED, id, { ...keep, ...data }, { title: data.title, desc: data.desc, cat: data.cat, parts: (v.parts || []).map(p => p.key) });

function backupIdentity() {

  a.download = 'identita-web7.json';

async function restoreIdentity(input) {

// ── diretta: spezzoni brevi pubblicati in un contratto che si aggiorna ─────
const SEGMENT_MS = 10000;
const LIVE_SITE = 'w70-diretta';
let liveState = null;
function viewLive() {
  const lives = items.filter(v => v.live && FNet.isVisible(v));
  app.innerHTML = `<div class="livebox" style="max-width:720px;margin:auto"><h1 style="font-size:21px;margin-bottom:6px">Diretta</h1>
    <p class="sub" style="margin-bottom:12px">Il video viaggia a spezzoni sulla rete Freenet: chi guarda ti vede con circa un minuto di ritardo.</p>
    <video id="live-preview" muted playsinline autoplay></video>
    <form id="live-form" onsubmit="event.preventDefault();startLive(this)">
      <label class="field"><span>Titolo</span><input name="title" maxlength="120" required></label>
      <label class="field"><span>Categoria educativa</span>${categorySelect('')}</label>
      <button class="btn main" id="live-btn" style="width:100%">🔴 Vai in diretta</button></form>
    <div class="sub" id="live-status" style="margin-top:10px"></div></div>
    <h2 style="margin:20px 0 10px">In onda ora</h2><div class="grid">${lives.map(card).join('')}</div>${lives.length ? '' : '<p class="sub">Nessuna diretta in corso.</p>'}`;
  if (liveState) drawLiveRunning();
}
function drawLiveRunning() {
  const b = document.getElementById('live-btn');
  if (b) { b.textContent = '⏹ Termina la diretta'; b.type = 'button'; b.onclick = stopLive; }
  const p = document.getElementById('live-preview');
  if (p) p.srcObject = liveState.stream;
}
async function startLive(form) {
  const status = document.getElementById('live-status');
  try {
    if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('Fotocamera non disponibile qui');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 }, audio: true });
    const id = FNet.newId('v');
    liveState = { stream, id, n: 0, title: form.title.value.trim(), cat: form.cat.value, busy: false, key: null };
    drawLiveRunning();
    status.textContent = 'Preparo la diretta…';
    await FNet.writeText(LIVE_SITE, 'index.html', '<!doctype html><meta charset="utf-8"><title>Diretta Web 7.0</title><p>Diretta di Web 7.0.</p>');
    recordSegment();
  } catch (e) {
    liveState = null;
    status.textContent = 'Non riesco ad avviare la diretta: ' + e.message;
  }
}
function recordSegment() {
  if (!liveState) return;
  const state = liveState;
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus') ? 'video/webm;codecs=vp8,opus' : 'video/webm';
  const rec = new MediaRecorder(state.stream, { mimeType: mime, videoBitsPerSecond: 500000 });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    if (liveState === state) recordSegment();
    publishSegment(state, new Blob(chunks, { type: 'video/webm' }));
  };
  rec.start();
  setTimeout(() => { if (rec.state === 'recording') rec.stop(); }, SEGMENT_MS);
}
// Se la rete è più lenta della telecamera si salta uno spezzone invece di accumulare ritardo.
async function publishSegment(state, blob) {
  if (state.busy) return;
  state.busy = true;
  const status = document.getElementById('live-status');
  try {
    const n = state.n++;
    await FNet.writeBlob(LIVE_SITE, `seg${n}.webm`, blob);
    if (n >= 3) await FNet.call('siteDeleteFile', { site: LIVE_SITE, file: `seg${n - 3}.webm` });
    await FNet.writeText(LIVE_SITE, 'live.json', JSON.stringify({ n, t: Date.now(), on: true }));
    const key = await FNet.publishSite(LIVE_SITE);
    if (!state.key) {
      state.key = key;
      await FNet.saveItem(FEED, state.id, { title: state.title, cat: state.cat, desc: 'Diretta su FreenetTV', live: true, ch: key, vis: 'public' });
    }
    if (status && liveState === state) status.textContent = `In onda: spezzone ${n + 1} pubblicato`;
  } catch (e) {
    if (status) status.textContent = 'Spezzone non pubblicato: ' + e.message;
  }
  state.busy = false;
}
async function stopLive() {
  const state = liveState;
  liveState = null;
  state.stream.getTracks().forEach(t => t.stop());
  if (state.key) {
    try {
      await FNet.writeText(LIVE_SITE, 'live.json', JSON.stringify({ n: state.n, t: Date.now(), on: false }));
      await FNet.publishSite(LIVE_SITE);
    } catch {}
    await FNet.deleteItem(FEED, state.id);
  }
  toast('Diretta terminata');
  viewLive();
}
async function playLive(v) {
  const state = document.getElementById('player-state');
  if (!FNet.SAFE_KEY.test(v.ch || '')) { state.textContent = 'Diretta non disponibile'; return; }
  let last = -1;
  const queue = [];
  let el = null;
  const playNext = () => {
    if (!el || !queue.length || (!el.paused && !el.ended)) return;
    el.src = queue.shift();
    el.play().catch(() => {});
  };
  while (current === v) {
    try {
      const info = await (await fetch(FNet.siteUrl(v.ch, 'live.json') + '?t=' + Date.now())).json();
      if (!info.on && !el) { if (state) state.textContent = 'La diretta è terminata'; return; }
      if (info.n > last) {
        const from = last < 0 ? info.n : last + 1;
        for (let n = from; n <= info.n; n++) {
          queue.push(URL.createObjectURL(await FNet.fetchPart(FNet.siteUrl(v.ch, `seg${n}.webm`))));
        }
        last = info.n;
        if (!el) {
          document.getElementById('player').innerHTML = '<video id="vid" controls playsinline autoplay></video>';
          el = document.getElementById('vid');
          el.onended = playNext;
        }
        playNext();
      }
    } catch {}
    await new Promise(res => setTimeout(res, 5000));
  }
}

// ── router ─────────────────────────────────────────────────────────────────
async function drawChrome() {
  const name = await FNet.displayName();
  document.getElementById('me-avatar').innerHTML = avatarHtml(name, FNet.profile().avatar);
  const route = location.hash || '#/home';
  const entry = ([hash, icon, label]) => `<a class="nav-item ${route.startsWith(hash) ? 'on' : ''}" href="${hash}"><span>${icon}</span><span>${label}</span></a>`;
  document.getElementById('side').innerHTML = NAV.map(entry).join('');
  document.getElementById('bottom').innerHTML = NAV.filter(n => PHONE_NAV.includes(n[0])).map(entry).join('');
}
async function render() {
  const seq = ++renderSeq;
  const [, page, arg] = (location.hash || '#/home').match(/^#\/([a-z]+)\/?(.*)$/) || [null, 'home', ''];
  const param = arg ? decodeURIComponent(arg) : '';
  drawChrome();
  if (page !== 'watch') current = null;
  document.getElementById('menu').hidden = true;
  try {
    if (page === 'watch') await viewWatch(param);
    else if (page === 'subs') await viewSubs(seq);
    else if (page === 'library') await viewLibrary();
    else if (page === 'channel') await viewChannel(param || 'me', seq);
    else if (page === 'upload') viewUpload();
    else if (page === 'studio') await viewStudio(param);
    else if (page === 'edit') await viewEdit(param);
    else if (page === 'settings') viewSettings();
    else if (page === 'live') { await refresh(); viewLive(); }
    else await viewHome(param, seq);
  } catch (e) {
    app.innerHTML = emptyBox('⚠️', 'Qualcosa non ha funzionato', e.message);
  }
}
addEventListener('hashchange', render);
render();
