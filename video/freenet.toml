# Configurazione app FreenetTV (YouTube personale su Freenet)
# Pubblicata con: fdev website publish . --key fresnettv
[app]
name    = "FreenetTV"
version = "1.0.0"
description = "YouTube personale su Freenet — tutti i nodi possono guardare, caricare, commentare e mettere like"

[publish]
# Inizializza la chiave con: fdev website init fresnettv
key = "fresnettv"
directory = "."
entry = "index.html"
