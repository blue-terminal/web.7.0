name: Build PC

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release a cui allegare i pacchetti
        default: v2.0.0
        required: true

permissions:
  contents: write

env:
  FREENET_VERSION: v0.2.154
  WEB70_VERSION: 2.0.0

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica nodo Freenet e fdev ufficiali
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          gh release download "$FREENET_VERSION" --repo freenet/freenet-core --dir downloads \
            --pattern "freenet-${{ matrix.target }}.*" --pattern "fdev-${{ matrix.target }}.*" --pattern SHA256SUMS.txt

      - name: Crea e prova il pacchetto
        run: |
          python -m pip install pyinstaller==6.11.1
          python pc/package.py --downloads downloads --target "${{ matrix.target }}" --name "${{ matrix.name }}" --version "$WEB70_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: web70-${{ matrix.name }}
          path: dist/web70-*

      - name: Allega alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" dist/web70-* --clobber
